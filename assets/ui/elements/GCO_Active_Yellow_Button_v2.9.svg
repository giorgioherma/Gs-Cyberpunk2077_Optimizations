<svg xmlns="http://www.w3.org/2000/svg" width="760" height="112" viewBox="0 0 760 112" fill="none">
  <defs>
    <path id="buttonShape" d="M31 10H728L750 32V80L728 102H31L9 80V32L31 10Z"/>

    <linearGradient id="insetHighlight" x1="18" y1="18" x2="625" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.49" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.68" stop-color="#FFFDF0" stop-opacity="0.97"/>
      <stop offset="0.84" stop-color="#FFF4CB" stop-opacity="0.69"/>
      <stop offset="0.94" stop-color="#FFECC1" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFECC1" stop-opacity="0"/>
    </linearGradient>
    <filter id="insetHalo" x="-30%" y="-100%" width="190%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.1"/>
    </filter>
    <!-- Fine, near-white illumination that remains concentrated around the source line. -->
    <filter id="nearWhiteGlow" x="-40%" y="-130%" width="210%" height="360%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.15"/>
    </filter>
    <!-- Light emitted from the complete corner path: two soft halos, with no rectangular gradient edge. -->
    <filter id="wideLineGlow" x="-50%" y="-200%" width="220%" height="500%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="11 16"/>
    </filter>
    <filter id="mediumLineGlow" x="-45%" y="-150%" width="200%" height="400%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6.2 9"/>
    </filter>
    <linearGradient id="bodyGradient" x1="70" y1="18" x2="690" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8F487"/>
      <stop offset="18%" stop-color="#F5E548"/>
      <stop offset="52%" stop-color="#E5B51A"/>
      <stop offset="100%" stop-color="#B97D10"/>
    </linearGradient>

    <radialGradient id="topLight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 16) rotate(28) scale(330 120)">
      <stop offset="0%" stop-color="#FFF8BE" stop-opacity="0.45"/>
      <stop offset="38%" stop-color="#FFF18A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFF18A" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm gold beam: two feathered shoulders and a luminous gold center. -->
    <linearGradient id="diagonalSheen" gradientUnits="userSpaceOnUse" x1="30" y1="22" x2="293" y2="22">
      <stop offset="0%" stop-color="#CC8400" stop-opacity="0"/>
      <stop offset="14%" stop-color="#D68D00" stop-opacity="0.16"/>
      <stop offset="30%" stop-color="#F9BA00" stop-opacity="0.24"/>
      <stop offset="48%" stop-color="#FFE326" stop-opacity="0.48"/>
      <stop offset="58%" stop-color="#FFF777" stop-opacity="0.68"/>
      <stop offset="72%" stop-color="#FFE630" stop-opacity="0.32"/>
      <stop offset="90%" stop-color="#FFC40B" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#FFC40B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheenAura" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8AF00" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFD300" stop-opacity="0.23"/>
      <stop offset="65%" stop-color="#FFF51F" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFD300" stop-opacity="0"/>
    </linearGradient>
    <filter id="sheenSoftGlow" x="-20%" y="-70%" width="140%" height="240%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <!-- Dissolves into the yellow surface near the button midline. -->
    <linearGradient id="sheenVerticalFade" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="69">
      <stop offset="0%" stop-color="white" stop-opacity="0.96"/>
      <stop offset="25%" stop-color="white" stop-opacity="0.82"/>
      <stop offset="52%" stop-color="white" stop-opacity="0.38"/>
      <stop offset="85%" stop-color="white" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="stripeFade" maskUnits="userSpaceOnUse" x="0" y="0" width="760" height="112" style="mask-type:alpha">
      <rect x="0" y="0" width="760" height="112" fill="url(#sheenVerticalFade)"/>
    </mask>
    <clipPath id="buttonClip"><use href="#buttonShape"/></clipPath>
    <clipPath id="shellClip"><use href="#buttonShape"/></clipPath>

    <linearGradient id="lowerRightLine" x1="550" y1="94" x2="740" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF0A3" stop-opacity="0"/>
      <stop offset="35%" stop-color="#FFF0A3" stop-opacity="0.24"/>
      <stop offset="75%" stop-color="#FFE66D" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#FFF1A4" stop-opacity="0.56"/>
    </linearGradient>

    <linearGradient id="lowerShade" x1="0" y1="112" x2="0" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7F5708" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7F5708" stop-opacity="0"/>
    </linearGradient>
    <!-- Deep graphite-to-black rim: contrast against the gold, no cyan. -->
    <linearGradient id="outline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B0D"/>
      <stop offset="40%" stop-color="#1B1D1C"/>
      <stop offset="80%" stop-color="#05090B"/>
      <stop offset="100%" stop-color="#121618"/>
    </linearGradient>
    <filter id="rimGlow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="4.8"/>
    </filter>
    </defs>

  <!-- Soft outer dark halo, on the actual shell path rather than a new inset outline. -->
  <use href="#buttonShape" fill="none" stroke="#020406" stroke-width="8.4" filter="url(#rimGlow)" stroke-opacity=".82"/>
  <use href="#buttonShape" fill="url(#bodyGradient)"/>
  <use href="#buttonShape" fill="url(#topLight)"/>
  <use href="#buttonShape" fill="url(#lowerShade)"/>

  <!-- Yellow-gold glint: softened glow underneath an angled sheen, both dissolve by midline. -->
  <g clip-path="url(#buttonClip)" mask="url(#stripeFade)">
    <path d="M169 10H293L155 102H30Z" fill="#FFD51C" opacity="0.42" filter="url(#sheenSoftGlow)"/>
    <path d="M169 10H293L155 102H30Z" fill="url(#diagonalSheen)"/>
  </g>

  <!-- Graduated dark edge shading *inside* the gold. The three translucent
       strokes share exactly the same shell path: no offset/stacked outline. -->
  <g clip-path="url(#buttonClip)" fill="none" stroke="#030608" stroke-linejoin="round">
    <use href="#buttonShape" stroke-width="20" stroke-opacity=".10"/>
    <use href="#buttonShape" stroke-width="13" stroke-opacity=".12"/>
    <use href="#buttonShape" stroke-width="7" stroke-opacity=".17"/>
  </g>

  <!-- Layered glow is emitted by the exact 1.4 corner path, with brighter white near the source
       and a slower gold transition away from it. No hard-edged wash. -->
  <g clip-path="url(#shellClip)" fill="none" stroke="url(#insetHighlight)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 59V39L40 17H625" stroke-width="29" opacity="0.39" filter="url(#wideLineGlow)"/>
    <path d="M18 59V39L40 17H625" stroke-width="19" opacity="0.45" filter="url(#mediumLineGlow)"/>
    <path d="M18 59V39L40 17H625" stroke-width="9.6" opacity="0.75" filter="url(#insetHalo)"/>
    <path d="M18 59V39L40 17H625" stroke-width="4.8" opacity="0.76" filter="url(#nearWhiteGlow)"/>
  </g>
  <!-- Exact same source line and geometry as v2.7, sharpened only by lighting. -->
  <path d="M18 59V39L40 17H625" stroke="url(#insetHighlight)" stroke-width="1.72" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- One continuous lower-right inner highlight, tucked inside outer shell -->
  <path d="M550 94H724L740 78V64" stroke="url(#lowerRightLine)" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"/>

  <use href="#buttonShape" fill="none" stroke="url(#outline)" stroke-width="2.8"/>
  <path d="M667 92L680 75H692L679 92H667Z" fill="#090D0F"/>
  <path d="M686 92L699 75H711L698 92H686Z" fill="#090D0F"/>

  <text x="380" y="66" text-anchor="middle" font-family="Rajdhani, Oxanium, Arial Narrow, sans-serif" font-size="26" font-weight="700" letter-spacing="1.0" fill="#090D0F">INSTALL PROFILERS</text>
</svg>
