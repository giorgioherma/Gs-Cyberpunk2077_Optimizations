<svg xmlns="http://www.w3.org/2000/svg" width="760" height="112" viewBox="0 0 760 112" role="img" aria-label="GCO Restore Profilers enabled button">
  <defs>
    <!-- Exactly the same outer shape and dimensions as the active yellow design. -->
    <path id="shell" d="M31 10H728L750 32V80L728 102H31L9 80V32L31 10Z"/>
    <clipPath id="shellClip"><use href="#shell"/></clipPath>

    <!-- Restore has a lightly polished steel top that transitions into the dark blue-black bottom. -->
    <linearGradient id="steelFill" x1="0" y1="9" x2="0" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#769AA8"/>
      <stop offset="0.11" stop-color="#6B8E9B"/>
      <stop offset="0.24" stop-color="#41616C"/>
      <stop offset="0.46" stop-color="#1C333D"/>
      <stop offset="0.74" stop-color="#0A1921"/>
      <stop offset="1" stop-color="#071218"/>
    </linearGradient>
    <linearGradient id="horizShade" x1="38" y1="50" x2="733" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B0CFDA" stop-opacity="0.13"/>
      <stop offset="0.25" stop-color="#DDF6FF" stop-opacity="0.03"/>
      <stop offset="0.78" stop-color="#00242B" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#002329" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="topRim" x1="60" y1="10" x2="690" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8DF6FF" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#C3F9FF" stop-opacity="0.82"/>
      <stop offset="0.65" stop-color="#65DDEA" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#54DEE9" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="outerRim" x1="60" y1="0" x2="710" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67EEFA"/>
      <stop offset="0.4" stop-color="#20BECF"/>
      <stop offset="0.72" stop-color="#0BA3B5"/>
      <stop offset="1" stop-color="#56E8F4"/>
    </linearGradient>
    <filter id="rimHalo" x="-10%" y="-55%" width="120%" height="210%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <linearGradient id="insetHighlight" x1="18" y1="18" x2="625" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.64" stop-color="#F6FEFF" stop-opacity="0.95"/>
      <stop offset="0.82" stop-color="#DDF8FF" stop-opacity="0.60"/>
      <stop offset="0.93" stop-color="#BEEAF4" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#9BCCDB" stop-opacity="0"/>
    </linearGradient>
    <filter id="insetHalo" x="-30%" y="-100%" width="190%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <!-- Light emitted from the complete corner path: two soft halos, with no rectangular gradient edge. -->
    <filter id="wideLineGlow" x="-50%" y="-200%" width="220%" height="500%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9 13"/>
    </filter>
    <filter id="mediumLineGlow" x="-45%" y="-150%" width="200%" height="400%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4.8 7.5"/>
    </filter>
    <!-- Broad diagonal reflection, fading completely in the middle rather than cutting off. -->
    <linearGradient id="diagonalSheen" x1="80" y1="10" x2="252" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D6F5FB" stop-opacity="0"/>
      <stop offset="0.23" stop-color="#D3F2F7" stop-opacity="0.08"/>
      <stop offset="0.48" stop-color="#B5E8F2" stop-opacity="0.20"/>
      <stop offset="0.68" stop-color="#DBF8FC" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#B1E9F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="diagonalFade" x1="0" y1="10" x2="0" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0.93"/>
      <stop offset="0.35" stop-color="white" stop-opacity="0.64"/>
      <stop offset="0.68" stop-color="white" stop-opacity="0.21"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="760" height="112" style="mask-type:alpha">
      <rect width="760" height="112" fill="url(#diagonalFade)"/>
    </mask>
    <linearGradient id="lowInner" x1="550" y1="95" x2="740" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9BE6F2" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#68D4DF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#BBF9FF" stop-opacity="0.34"/>
    </linearGradient>
  </defs>

  <!-- Subdued cyan rim; hover later increases glow in native WPF. -->
  <use href="#shell" fill="none" stroke="#1BDCEB" stroke-width="3.4" stroke-opacity="0.44" filter="url(#rimHalo)"/>
  <use href="#shell" fill="url(#steelFill)"/>
  <g clip-path="url(#shellClip)">
    <rect x="7" y="8" width="746" height="96" fill="url(#horizShade)"/>
    <g mask="url(#fadeMask)">
      <path d="M120 10H290L172 104H4Z" fill="url(#diagonalSheen)"/>
    </g>
    <!-- Top sheen lives on the existing outer geometry, not on a second stacked border. -->
    <path d="M31 11H728" stroke="url(#topRim)" stroke-width="1.25"/>
  </g>
  <use href="#shell" fill="none" stroke="url(#outerRim)" stroke-width="1.65"/>

  <!-- All glow follows the exact highlight path, no broad rectangular wash or cutoff. -->
  <g clip-path="url(#shellClip)" fill="none" stroke="url(#insetHighlight)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 59V39L40 17H625" stroke-width="26" opacity="0.33" filter="url(#wideLineGlow)"/>
    <path d="M18 59V39L40 17H625" stroke-width="15" opacity="0.35" filter="url(#mediumLineGlow)"/>
    <path d="M18 59V39L40 17H625" stroke-width="8.6" opacity="0.58" filter="url(#insetHalo)"/>
  </g>
  <!-- Preserve the 1.2 thin bright line and exact length. -->
  <path d="M18 59V39L40 17H625" stroke="url(#insetHighlight)" stroke-width="1.72" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M550 94H724L740 78V64" stroke="url(#lowInner)" stroke-width="1.1" fill="none" stroke-linejoin="round"/>

  <!-- Same lower-right slash placement as the approved yellow button. -->
  <g fill="#08DDEC">
    <path d="M667 92L680 75H692L679 92H667Z"/>
    <path d="M686 92L699 75H711L698 92H686Z"/>
  </g>

  <!-- Text is provisional: implementation will use native centered WPF text. -->
  <text x="380" y="66" text-anchor="middle"
    font-family="Oxanium, Rajdhani, 'DejaVu Sans Condensed', sans-serif"
    font-size="26" font-weight="700" letter-spacing="0.4"
    fill="#00DDEB">RESTORE PROFILERS</text>
</svg>
