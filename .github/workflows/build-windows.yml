name: Build integrated GCO CET GRSP PresentMon

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'Directory.Build.props'
      - 'integrations/three-profiler-test/Build-Test.ps1'
      - 'src/GTotalOptimizer.App/**'
      - 'src/GTotalOptimizer.Launcher/**'
      - 'src/GTotalOptimizer.Core/**'
      - 'tests/GTotalOptimizer.Core.Tests/**'

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: unified
      - uses: actions/checkout@v4
        with:
          repository: giorgioherma/G-CET_Runtime_Profiler
          ref: 7f3489d8fd7e02d595f4a053616044cf2f6b2dab
          path: unified/vendor-cet
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: giorgioherma/GRSP-G-REDscript-Profiler
          ref: c6871e21d3d3ece8e36d3ea47d45e18d0d7acead
          path: unified/vendor-grsp
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download exact latest successful CET developer profiler artifact
        shell: pwsh
        working-directory: unified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh run download 41820765951 --repo giorgioherma/G-CET_Runtime_Profiler --name G-CET-Runtime-Profiler-v1.3.4 --dir downloaded-cet
          if ($LASTEXITCODE -ne 0) { throw 'Unable to authenticate verified CET dev artifact download; do not substitute old release.' }
          Write-Host 'CET dev artifact download succeeded.'
      - name: Assemble integrated two-page GUI and profilers (one shared runtime)
        shell: pwsh
        working-directory: unified
        run: |
          & ./integrations/three-profiler-test/Build-Test.ps1 -Integrated
          if ($LASTEXITCODE -ne 0) { throw 'Integrated package assembly failed' }
      - name: Smoke integrated CET/GRSP launchers and GRSP install/restore
        shell: pwsh
        working-directory: unified
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path publish/G-Total-Optimizer-v1.1.5).Path
          $env:DOTNET_ROOT_X64=Join-Path $root 'runtime'
          $env:DOTNET_ROOT=$env:DOTNET_ROOT_X64
          $env:DOTNET_MULTILEVEL_LOOKUP='0'
          $env:DOTNET_HOST_TRACE='1'
          $env:DOTNET_HOST_TRACEFILE=Join-Path $env:RUNNER_TEMP 'Triple-Net10-Host.txt'
          function ExecVerified([string]$executable,[string]$arguments) {
            $info=New-Object System.Diagnostics.ProcessStartInfo
            $info.FileName=$executable
            $info.Arguments=$arguments
            $info.WorkingDirectory=Split-Path $executable
            $info.UseShellExecute=$false
            $info.CreateNoWindow=$true
            $info.RedirectStandardOutput=$true
            $info.RedirectStandardError=$true
            $process=New-Object System.Diagnostics.Process
            $process.StartInfo=$info
            if (!$process.Start()) { throw "Could not start $executable" }
            $out=$process.StandardOutput.ReadToEndAsync()
            $err=$process.StandardError.ReadToEndAsync()
            if (!$process.WaitForExit(90000)) { $process.Kill(); throw "Process timed out: $executable" }
            $exit=$process.ExitCode
            $stdout=$out.GetAwaiter().GetResult()
            $stderr=$err.GetAwaiter().GetResult()
            $process.Dispose()
            if ($exit -ne 0) { throw "CLI $executable $arguments exit=$exit stderr=$stderr stdout=$stdout" }
            return $stdout
          }
          $version='1.1.5'
          if ((Get-Content (Join-Path $root 'VERSION.txt') -Raw).Trim() -ne $version) { throw 'Integrated package version mismatch' }
          $cet=Join-Path $root 'components/cet/G-CET-Runtime-Profiler.exe'
          $grsp=Join-Path $root 'components/grsp/G-REDscript-Profiler.exe'
          $cetHelp=ExecVerified $cet '--help'
          if ($cetHelp -notmatch '--install') { throw "CET CLI stdout is missing: $cetHelp" }
          $grHelp=ExecVerified $grsp '--help'
          if ($grHelp -notmatch '--install') { throw "GRSP CLI stdout is missing: $grHelp" }
          $fixture=Join-Path $env:RUNNER_TEMP 'Triple-RED4ext-Fixture'
          New-Item -ItemType Directory -Force (Join-Path $fixture 'bin/x64'),(Join-Path $fixture 'bin/x64/plugins'),(Join-Path $fixture 'red4ext/plugins') | Out-Null
          New-Item -ItemType File -Force (Join-Path $fixture 'bin/x64/Cyberpunk2077.exe') | Out-Null
          # Regression: CET ProfilerStatus.CetState is serialized as JSON field 'cet'.
          # Exercise the actual source-owned CET headless CLI, not a mock object.
          $cetPre=(ExecVerified $cet ('--status --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
          if (-not $cetPre.ok -or ($cetPre.PSObject.Properties.Name -notcontains 'cet') -or
              $cetPre.cet -ne 'MISSING' -or $cetPre.managed -or $cetPre.captureReadyForCollection) {
            throw "Unexpected CET status JSON schema/state: $($cetPre | ConvertTo-Json -Compress -Depth 4)"
          }
          Write-Host 'PASS actual CET CLI status JSON wire schema (cet/managed/captureReadyForCollection).'
          $pre=(ExecVerified $grsp ('--status --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
          if (!$pre.ok -or $pre.result.State -ne 'NOT_INSTALLED') { throw "GRSP preflight failed: $($pre.result.State)" }
          try {
            $installed=(ExecVerified $grsp ('--install --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
            if (!$installed.ok) { throw 'GRSP fixture installer failed' }
            $mid=(ExecVerified $grsp ('--status --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
            if (!$mid.ok -or $mid.result.State -ne 'INSTALLED_CURRENT') { throw 'GRSP installed state not confirmed' }
          }
          finally {
            $restored=(ExecVerified $grsp ('--restore --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
            if (!$restored.ok) { throw 'GRSP fixture restore failed' }
          }
          $post=(ExecVerified $grsp ('--status --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
          if ($post.result.State -ne 'NOT_INSTALLED') { throw 'GRSP fixture state remains after restore' }
          if (!(Test-Path $env:DOTNET_HOST_TRACEFILE)) { throw 'Private .NET10 host trace missing' }
          Write-Host 'PASS CET+GRSP private .NET10 headless CLI launches and GRSP owned install/restore.'
      - name: Test source contracts and verify the final downloadable package
        shell: pwsh
        working-directory: unified
        run: |
          $ErrorActionPreference='Stop'
          $version=(dotnet msbuild src/GTotalOptimizer.App/GTotalOptimizer.App.csproj -getProperty:Version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne '1.1.5') { throw 'Unexpected GCO package version' }
          $root=(Resolve-Path "publish/G-Total-Optimizer-v$version").Path
          dotnet run --project tests/GTotalOptimizer.Core.Tests/GTotalOptimizer.Core.Tests.csproj -c Release -- "$root"
          if ($LASTEXITCODE -ne 0) { throw 'Final packaged GCO identity/integrity verification failed' }
          foreach ($exe in @(
            (Join-Path $root 'G-Total-Optimizer.exe'),
            (Join-Path $root 'app/G-Total-Optimizer.App.exe')
          )) {
            if ((Get-Item $exe).VersionInfo.FileVersion -ne '1.1.5.0') {
              throw "GCO executable version mismatch: $exe"
            }
          }
          if ((Get-Content (Join-Path $root 'VERSION.txt') -Raw).Trim() -ne '1.1.5') {
            throw 'VERSION.txt mismatch'
          }
          if ((Get-ChildItem $root -Filter coreclr.dll -File -Recurse).Count -ne 1) {
            throw 'Integrated package must bundle exactly one CLR'
          }
          # Prove the actual GCO Windows apphost, not just test code, resolves its
          # shipped manifest from its own EXE location when CWD is unrelated.
          $env:DOTNET_ROOT_X64=Join-Path $root 'runtime'
          $env:DOTNET_ROOT=$env:DOTNET_ROOT_X64
          $info=New-Object System.Diagnostics.ProcessStartInfo
          $info.FileName=Join-Path $root 'app/G-Total-Optimizer.App.exe'
          $info.ArgumentList.Add('--verify-package')
          $info.WorkingDirectory=$env:RUNNER_TEMP
          $info.UseShellExecute=$false
          $info.CreateNoWindow=$true
          $info.RedirectStandardOutput=$true
          $info.RedirectStandardError=$true
          $proc=New-Object System.Diagnostics.Process
          $proc.StartInfo=$info
          if (!$proc.Start()) { throw 'Could not launch the shipped GCO apphost for package check' }
          $stdoutTask=$proc.StandardOutput.ReadToEndAsync()
          $stderrTask=$proc.StandardError.ReadToEndAsync()
          if (!$proc.WaitForExit(30000)) { $proc.Kill(); throw 'Shipped GCO package check timed out' }
          $out=$stdoutTask.GetAwaiter().GetResult()
          $err=$stderrTask.GetAwaiter().GetResult()
          if ($proc.ExitCode -ne 0) { throw "Shipped GCO package check failed: $err $out" }
          $check=$out | ConvertFrom-Json
          if ($check.ok -ne $true -or $check.root -ne $root -or
              $check.manifest -ne (Join-Path $root 'components/manifest.json')) {
            throw "GCO process resolved the wrong package root: $out"
          }
          Write-Host 'PASS actual shipped GUI host detects verified component manifest from unrelated CWD'
          Write-Host "PASS finished GCO v$version package and complete owner payload manifest verification"
      - uses: actions/upload-artifact@v4
        with:
          name: G-Total-Optimizer-v1.1.5-Integrated-win-x64
          path: unified/publish/G-Total-Optimizer-v1.1.5/
          if-no-files-found: error
