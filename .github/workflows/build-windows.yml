name: Gs-Cyberpunk2077_Optimizer
# Product version changes only on an explicit user request; keep fixed otherwise.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'Directory.Build.props'
      - 'integrations/three-profiler-test/Build-Test.ps1'
      - 'integrations/three-profiler-test/Apply-GcoCaptureLifecycle.ps1'
      - 'src/GTotalOptimizer.App/**'
      - 'assets/ui/elements/**'
      - 'src/GTotalOptimizer.Launcher/**'
      - 'src/GTotalOptimizer.Core/**'
      - 'tests/GTotalOptimizer.Core.Tests/**'

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: unified
      - uses: actions/checkout@v4
        with:
          repository: giorgioherma/G-CET_Runtime_Profiler
          ref: 7f3489d8fd7e02d595f4a053616044cf2f6b2dab
          path: unified/vendor-cet
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: giorgioherma/GRSP-G-REDscript-Profiler
          ref: c6871e21d3d3ece8e36d3ea47d45e18d0d7acead
          path: unified/vendor-grsp
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # High-value physical compiler contract: validate the exact supported
      # upstream release archive, then exercise GCO's real path/hash detector.
      - name: Verify official redscript 0.5.31 reference binaries
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'redscript-0.5.31-official.zip'
          $folder=Join-Path $env:RUNNER_TEMP 'redscript-0.5.31-reference'
          Invoke-WebRequest -Uri 'https://github.com/jac3km4/redscript/releases/download/v0.5.31/redscript-v0.5.31-windows.zip' -OutFile $zip
          $digest=(Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($digest -ne '799BBD88863F6728616F8D723C941EA15DFF71ED5BBFD50C525F0D39EA0BF46B') {
            throw "Official redscript release archive digest mismatch: $digest"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $folder -Force
          $required=@{
            'scc.exe'='DA2C0DE580173010C907A05FDD2F3CD2430D6E62BF748339D65060118AE32EDD'
            'scc_lib.dll'='49EB60A3613C990CD13B6136E827A74F9F64AD68E2F911D8C93E4E3D3F53C100'
          }
          foreach($file in @('scc.exe','scc_lib.dll')) {
            $matches=@(Get-ChildItem -LiteralPath $folder -Recurse -File -Filter $file)
            if($matches.Count -ne 1) { throw "Missing or ambiguous upstream $file count=$($matches.Count)" }
            $hash=(Get-FileHash -LiteralPath $matches[0].FullName -Algorithm SHA256).Hash
            if ($hash -ne $required[$file]) { throw "Supported v0.5.31 $file SHA256 mismatch: $hash" }
            Write-Host "PASS official redscript 0.5.31 $file fingerprint: $hash"
          }
          "GCO_REDSCRIPT_REFERENCE_GAME_ROOT=$folder" >> $env:GITHUB_ENV
      - name: Download exact latest successful CET developer profiler artifact
        shell: pwsh
        working-directory: unified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh run download 41820765951 --repo giorgioherma/G-CET_Runtime_Profiler --name G-CET-Runtime-Profiler-v1.3.4 --dir downloaded-cet
          if ($LASTEXITCODE -ne 0) { throw 'Unable to authenticate verified CET dev artifact download; do not substitute old release.' }
          Write-Host 'CET dev artifact download succeeded.'
      # GRSP's pinned Rust build takes ~6m on a fresh runner. The other
      # components are fast and remain rebuilt/verified by the normal script.
      - name: Identify reusable GRSP native compilation
        id: grsp_native_key
        shell: pwsh
        working-directory: unified
        run: |
          $ErrorActionPreference='Stop'
          $source=(& git -C vendor-grsp rev-parse HEAD).Trim()
          if ($source.Length -ne 40) { throw 'GRSP source commit is not pinned.' }
          $parts=@(
            'gco-grsp-native-v1',
            $source,
            ((& rustc -vV) -join '|'),
            (Get-FileHash 'integrations/three-profiler-test/Apply-GcoCaptureLifecycle.ps1' -Algorithm SHA256).Hash,
            (Get-FileHash 'integrations/three-profiler-test/Build-Test.ps1' -Algorithm SHA256).Hash
          )
          $fingerprint=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData(
            [Text.Encoding]::UTF8.GetBytes(($parts -join "`n")))).ToLowerInvariant()
          "key=gco-grsp-native-$fingerprint" >> $env:GITHUB_OUTPUT
          Write-Host 'PASS GRSP pinned source, GCO source adapter and Rust toolchain cache fingerprint'
      - name: Restore unchanged GRSP native binary
        id: grsp_native_cache
        uses: actions/cache/restore@v4
        with:
          path: unified/.gco-grsp-native
          key: ${{ steps.grsp_native_key.outputs.key }}
      - name: Assemble integrated two-page GUI and profilers (one shared runtime)
        shell: pwsh
        working-directory: unified
        env:
          GCO_GRSP_NATIVE_CACHE_KEY: ${{ steps.grsp_native_key.outputs.key }}
        run: |
          & ./integrations/three-profiler-test/Build-Test.ps1 -Integrated
          if ($LASTEXITCODE -ne 0) { throw 'Integrated package assembly failed' }
      - name: Save verified native GRSP binary for matching source
        if: steps.grsp_native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: unified/.gco-grsp-native
          key: ${{ steps.grsp_native_key.outputs.key }}
      - name: Smoke integrated CET/GRSP launchers and GRSP install/restore
        shell: pwsh
        working-directory: unified
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path "publish/release/G's Cyberpunk 2077 Optimization").Path
          $env:DOTNET_ROOT_X64=Join-Path $root 'runtime'
          $env:DOTNET_ROOT=$env:DOTNET_ROOT_X64
          $env:DOTNET_MULTILEVEL_LOOKUP='0'
          $env:DOTNET_HOST_TRACE='1'
          $env:DOTNET_HOST_TRACEFILE=Join-Path $env:RUNNER_TEMP 'Triple-Net10-Host.txt'
          function ExecVerified([string]$executable,[string]$arguments) {
            $info=New-Object System.Diagnostics.ProcessStartInfo
            $info.FileName=$executable
            $info.Arguments=$arguments
            $info.WorkingDirectory=Split-Path $executable
            $info.UseShellExecute=$false
            $info.CreateNoWindow=$true
            $info.RedirectStandardOutput=$true
            $info.RedirectStandardError=$true
            $process=New-Object System.Diagnostics.Process
            $process.StartInfo=$info
            if (!$process.Start()) { throw "Could not start $executable" }
            $out=$process.StandardOutput.ReadToEndAsync()
            $err=$process.StandardError.ReadToEndAsync()
            if (!$process.WaitForExit(90000)) { $process.Kill(); throw "Process timed out: $executable" }
            $exit=$process.ExitCode
            $stdout=$out.GetAwaiter().GetResult()
            $stderr=$err.GetAwaiter().GetResult()
            $process.Dispose()
            if ($exit -ne 0) { throw "CLI $executable $arguments exit=$exit stderr=$stderr stdout=$stdout" }
            return $stdout
          }
          $version=(dotnet msbuild src/GTotalOptimizer.App/GTotalOptimizer.App.csproj -getProperty:Version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Unable to resolve GCO version from MSBuild' }
          if ((Get-Content (Join-Path $root 'VERSION.txt') -Raw).Trim() -ne $version) { throw 'Integrated package version mismatch' }
          $cet=Join-Path $root 'components/cet/G-CET-Runtime-Profiler.exe'
          $grsp=Join-Path $root 'components/grsp/G-REDscript-Profiler.exe'
          $cetHelp=ExecVerified $cet '--help'
          if ($cetHelp -notmatch '--install') { throw "CET CLI stdout is missing: $cetHelp" }
          $grHelp=ExecVerified $grsp '--help'
          if ($grHelp -notmatch '--install') { throw "GRSP CLI stdout is missing: $grHelp" }
          $fixture=Join-Path $env:RUNNER_TEMP 'Triple-RED4ext-Fixture'
          New-Item -ItemType Directory -Force (Join-Path $fixture 'bin/x64'),(Join-Path $fixture 'bin/x64/plugins'),(Join-Path $fixture 'red4ext/plugins') | Out-Null
          New-Item -ItemType File -Force (Join-Path $fixture 'bin/x64/Cyberpunk2077.exe') | Out-Null
          # Regression: CET ProfilerStatus.CetState is serialized as JSON field 'cet'.
          # Exercise the actual source-owned CET headless CLI, not a mock object.
          $cetPre=(ExecVerified $cet ('--status --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
          if (-not $cetPre.ok -or ($cetPre.PSObject.Properties.Name -notcontains 'cet') -or
              $cetPre.cet -ne 'MISSING' -or $cetPre.managed -or $cetPre.captureReadyForCollection) {
            throw "Unexpected CET status JSON schema/state: $($cetPre | ConvertTo-Json -Compress -Depth 4)"
          }
          Write-Host 'PASS actual CET CLI status JSON wire schema (cet/managed/captureReadyForCollection).'
          $pre=(ExecVerified $grsp ('--status --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
          if (!$pre.ok -or $pre.result.State -ne 'NOT_INSTALLED') { throw "GRSP preflight failed: $($pre.result.State)" }
          try {
            $installed=(ExecVerified $grsp ('--install --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
            if (!$installed.ok) { throw 'GRSP fixture installer failed' }
            $mid=(ExecVerified $grsp ('--status --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
            if (!$mid.ok -or $mid.result.State -ne 'INSTALLED_CURRENT') { throw 'GRSP installed state not confirmed' }
            $live=Join-Path $fixture 'red4ext/plugins/G-REDscript-Profiler/RESULTS'
            $ownerDll=Join-Path $fixture 'red4ext/plugins/G-REDscript-Profiler.dll'
            $ownership=Join-Path $fixture 'red4ext/plugins/G-REDscript-Profiler/.manager_state.json'
            $installedHash=(Get-FileHash $ownerDll -Algorithm SHA256).Hash
            $cap=Join-Path $live 'Capture_0001_CI_1000'
            New-Item -ItemType Directory -Force $cap | Out-Null
            'capture,rows' | Set-Content (Join-Path $cap 'GRSP_Summary.csv')
            'COMPLETE' | Set-Content (Join-Path $cap 'GRSP_Status.txt')
            $crashed=(ExecVerified $grsp ('--status --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
            if ($crashed.result.CompletedCaptureCount -ne 0) {
              throw 'GCO GRSP accepted shutdown/crash CSVs without explicit F11 completion proof'
            }
            'F11_STOP' | Set-Content (Join-Path $cap 'GCO-F11-Complete.flag')
            $complete=(ExecVerified $grsp ('--status --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
            if ($complete.result.CompletedCaptureCount -ne 1) {
              throw 'GCO GRSP did not recognize verified F11-stop marker'
            }
            $discard=(ExecVerified $grsp ('--discard-live --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
            $clean=(ExecVerified $grsp ('--status --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
            if (!$discard.ok -or $discard.result.discarded -lt 1 -or
                $clean.result.CompletedCaptureCount -ne 0 -or
                $clean.result.State -ne 'INSTALLED_CURRENT' -or
                !(Test-Path $ownership) -or
                (Get-FileHash $ownerDll -Algorithm SHA256).Hash -ne $installedHash -or
                (Get-ChildItem $live -Force).Count -ne 0) {
              throw 'GRSP discard failed to reset live data while retaining installed profiler'
            }
            New-Item -ItemType Directory -Force $cap | Out-Null
            'capture,rows' | Set-Content (Join-Path $cap 'GRSP_Summary.csv')
            'COMPLETE' | Set-Content (Join-Path $cap 'GRSP_Status.txt')
            'F11_STOP' | Set-Content (Join-Path $cap 'GCO-F11-Complete.flag')
            $standaloneArchives=Join-Path $root 'components/grsp/RESULTS'
            $before=@(Get-ChildItem $standaloneArchives -Directory -ErrorAction SilentlyContinue).Count
            Write-Host 'PASS bundled GRSP: implicit/crash export refused; F11 completion accepted; discard is source owned'
          }
          finally {
            $restored=(ExecVerified $grsp ('--restore --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
            if (!$restored.ok) { throw 'GRSP fixture restore failed' }
            $after=@(Get-ChildItem $standaloneArchives -Directory -ErrorAction SilentlyContinue).Count
            if ($after -ne $before) {
              throw 'GCO GRSP Restore incorrectly archived uncollected live output'
            }
          }
          $post=(ExecVerified $grsp ('--status --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
          if ($post.result.State -ne 'NOT_INSTALLED') { throw 'GRSP fixture state remains after restore' }
          # The same RESTORE must recover a managed GRSP install when ownership
          # JSON is unreadable, without making a duplicate archive.
          $again=(ExecVerified $grsp ('--install --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
          if (!$again.ok -or !(Test-Path $ownership) -or !(Test-Path $ownerDll)) {
            throw 'GRSP recovery fixture could not reinstall managed profiler'
          }
          New-Item -ItemType Directory -Force $live | Out-Null
          'uncollected' | Set-Content (Join-Path $live 'partial.txt')
          '{invalid-owner-json' | Set-Content $ownership
          $damaged=(ExecVerified $grsp ('--status --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
          if ($damaged.result.State -ne 'INVALID_MANAGED_STATE' -or !$damaged.result.ManagedStatePresent) {
            throw 'Damaged GRSP owner state was not recognized as managed recovery'
          }
          $recovered=(ExecVerified $grsp ('--restore --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
          $afterRecovery=(ExecVerified $grsp ('--status --game "{0}" --json' -f $fixture)) | ConvertFrom-Json
          if (!$recovered.ok -or $afterRecovery.result.State -ne 'NOT_INSTALLED' -or
              (Test-Path $ownership) -or (Test-Path $ownerDll) -or
              @(Get-ChildItem $live -Force -ErrorAction SilentlyContinue).Count -ne 0 -or
              @(Get-ChildItem $standaloneArchives -Directory -ErrorAction SilentlyContinue).Count -ne $before) {
            throw 'RESTORE did not recover corrupt GRSP ownership marker without archiving'
          }
          Write-Host 'PASS bundled GRSP restore after damaged ownership JSON; no uncollected archive.'
          if (!(Test-Path $env:DOTNET_HOST_TRACEFILE)) { throw 'Private .NET10 host trace missing' }
          Write-Host 'PASS CET+GRSP private .NET10 headless CLI launches and GRSP owned install/restore.'
      - name: Test source contracts and verify the final downloadable package
        id: verify_package
        shell: pwsh
        working-directory: unified
        run: |
          $ErrorActionPreference='Stop'
          $version=(dotnet msbuild src/GTotalOptimizer.App/GTotalOptimizer.App.csproj -getProperty:Version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid GCO package version from MSBuild' }
          $root=(Resolve-Path "publish/release/G's Cyberpunk 2077 Optimization").Path
          dotnet run --project tests/GTotalOptimizer.Core.Tests/GTotalOptimizer.Core.Tests.csproj -c Release -- "$root"
          if ($LASTEXITCODE -ne 0) { throw 'Final packaged GCO identity/integrity verification failed' }
          foreach ($exe in @(
            (Join-Path $root 'Gs-Cyberpunk2077_Optimizer.exe'),
            (Join-Path $root 'app/G-Total-Optimizer.App.exe')
          )) {
            if ((Get-Item $exe).VersionInfo.FileVersion -ne "$version.0") {
              throw "GCO executable version mismatch: $exe"
            }
          }
          if ((Get-Content (Join-Path $root 'VERSION.txt') -Raw).Trim() -ne $version) {
            throw 'VERSION.txt mismatch'
          }
          # Prove the source/run identity is packaged, not merely shown by CI.
          $buildInfo=Get-Content (Join-Path $root 'BUILD-INFO.json') -Raw | ConvertFrom-Json
          if ($buildInfo.version -ne $version -or
              $buildInfo.sourceCommit -ne $env:GITHUB_SHA -or
              $buildInfo.githubRunId -ne $env:GITHUB_RUN_ID -or
              $buildInfo.githubRunAttempt -ne $env:GITHUB_RUN_ATTEMPT) {
            throw 'Packaged build metadata disagrees with GitHub source/run/attempt'
          }
          $guide=Get-Content (Join-Path (Split-Path $root -Parent) 'START-HERE.txt') -Raw
          if ($guide -notmatch [regex]::Escape("Optimizer v$version")) {
            throw 'Visible guide version disagrees with package version'
          }
          Write-Host "PASS versioned guide and source/run/attempt build provenance"
          if ((Get-ChildItem $root -Filter coreclr.dll -File -Recurse).Count -ne 1) {
            throw 'Integrated package must bundle exactly one CLR'
          }
          # Prove the actual GCO Windows apphost, not just test code, resolves its
          # shipped manifest from its own EXE location when CWD is unrelated.
          $env:DOTNET_ROOT_X64=Join-Path $root 'runtime'
          $env:DOTNET_ROOT=$env:DOTNET_ROOT_X64
          $info=New-Object System.Diagnostics.ProcessStartInfo
          $info.FileName=Join-Path $root 'app/G-Total-Optimizer.App.exe'
          $info.ArgumentList.Add('--verify-package')
          $info.WorkingDirectory=$env:RUNNER_TEMP
          $info.UseShellExecute=$false
          $info.CreateNoWindow=$true
          $info.RedirectStandardOutput=$true
          $info.RedirectStandardError=$true
          $proc=New-Object System.Diagnostics.Process
          $proc.StartInfo=$info
          if (!$proc.Start()) { throw 'Could not launch the shipped GCO apphost for package check' }
          $stdoutTask=$proc.StandardOutput.ReadToEndAsync()
          $stderrTask=$proc.StandardError.ReadToEndAsync()
          if (!$proc.WaitForExit(30000)) { $proc.Kill(); throw 'Shipped GCO package check timed out' }
          $out=$stdoutTask.GetAwaiter().GetResult()
          $err=$stderrTask.GetAwaiter().GetResult()
          if ($proc.ExitCode -ne 0) { throw "Shipped GCO package check failed: $err $out" }
          $check=$out | ConvertFrom-Json
          if ($check.ok -ne $true -or $check.root -ne $root -or
              $check.manifest -ne (Join-Path $root 'components/manifest.json')) {
            throw "GCO process resolved the wrong package root: $out"
          }
          Write-Host 'PASS actual shipped GUI host detects verified component manifest from unrelated CWD'

          # Offscreen WPF rendering regression: image presence in the ZIP is
          # insufficient. The actual UI must paint bright border pixels.
          $visual=New-Object System.Diagnostics.ProcessStartInfo
          $visual.FileName=Join-Path $root 'app/G-Total-Optimizer.App.exe'
          $visual.ArgumentList.Add('--verify-border-ui')
          $visual.WorkingDirectory=$env:RUNNER_TEMP
          $visual.UseShellExecute=$false
          $visual.CreateNoWindow=$true
          $visual.RedirectStandardOutput=$true
          $visual.RedirectStandardError=$true
          $wpfCheck=New-Object System.Diagnostics.Process
          $wpfCheck.StartInfo=$visual
          if (!$wpfCheck.Start()) { throw 'Could not run WPF outer-border regression' }
          $wpfOutTask=$wpfCheck.StandardOutput.ReadToEndAsync()
          $wpfErrTask=$wpfCheck.StandardError.ReadToEndAsync()
          if (!$wpfCheck.WaitForExit(60000)) {
            $wpfCheck.Kill()
            throw 'WPF outer-border visual regression timed out'
          }
          $wpfOut=$wpfOutTask.GetAwaiter().GetResult()
          $wpfErr=$wpfErrTask.GetAwaiter().GetResult()
          if ($wpfCheck.ExitCode -ne 0) {
            throw "WPF border pixels not verified: $wpfErr $wpfOut"
          }
          Write-Host $wpfOut

          # Actual Windows process-notification contract: attach to a real
          # short-lived child process and observe its exit, plus WMI start
          # notification when the runner's WMI service permits it.
          $eventInfo=New-Object System.Diagnostics.ProcessStartInfo
          $eventInfo.FileName=Join-Path $root 'app/G-Total-Optimizer.App.exe'
          $eventInfo.ArgumentList.Add('--verify-game-process-events')
          $eventInfo.WorkingDirectory=$env:RUNNER_TEMP
          $eventInfo.UseShellExecute=$false
          $eventInfo.CreateNoWindow=$true
          $eventInfo.RedirectStandardOutput=$true
          $eventInfo.RedirectStandardError=$true
          $eventCheck=New-Object System.Diagnostics.Process
          $eventCheck.StartInfo=$eventInfo
          if (!$eventCheck.Start()) { throw 'Cannot start Windows game-process event test' }
          $eventOutTask=$eventCheck.StandardOutput.ReadToEndAsync()
          $eventErrTask=$eventCheck.StandardError.ReadToEndAsync()
          if (!$eventCheck.WaitForExit(45000)) {
            $eventCheck.Kill()
            throw 'Windows game-process event test timed out'
          }
          $eventOut=$eventOutTask.GetAwaiter().GetResult()
          $eventErr=$eventErrTask.GetAwaiter().GetResult()
          if ($eventCheck.ExitCode -ne 0) {
            throw "Windows game-process events failed: $eventErr $eventOut"
          }
          Write-Host $eventOut

          # The native launcher now forwards headless control arguments and
          # provides the bundled private .NET10 runtime, including under UAC.
          # This headless path does not request elevation or modify the game.
          $native=New-Object System.Diagnostics.ProcessStartInfo
          $native.FileName=Join-Path $root 'Gs-Cyberpunk2077_Optimizer.exe'
          $native.ArgumentList.Add('--verify-package')
          $native.WorkingDirectory=$env:RUNNER_TEMP
          $native.UseShellExecute=$false
          $native.CreateNoWindow=$true
          $launcherCheck=New-Object System.Diagnostics.Process
          $launcherCheck.StartInfo=$native
          if (!$launcherCheck.Start()) { throw 'Native GCO launcher did not start' }
          if (!$launcherCheck.WaitForExit(45000)) {
            $launcherCheck.Kill()
            throw 'Native launcher did not forward headless verifier and exit'
          }
          if ($launcherCheck.ExitCode -ne 0) {
            throw "Native launcher/private runtime verifier failed with exit $($launcherCheck.ExitCode)"
          }
          Write-Host 'PASS native GCO launcher forwards args and starts verified private runtime'

          # Real native tray lifecycle: close the full managed GUI while keeping
          # the native host alive, reopen the same WPF page, then cleanly exit.
          # No game, UAC, profiler install or capture fixture is needed here.
          $launcherPath=Join-Path $root 'Gs-Cyberpunk2077_Optimizer.exe'
          $tray=$null
          $opened=$null
          $reopened=$null
          function FindGcoUi([int]$exclude) {
            foreach ($p in @(Get-Process -Name 'G-Total-Optimizer.App' -ErrorAction SilentlyContinue)) {
              try {
                if ($p.Id -ne $exclude -and
                    [IO.Path]::GetFullPath($p.Path) -eq (Join-Path $root 'app/G-Total-Optimizer.App.exe')) {
                  return $p
                }
              } finally {
                if ($p.Id -eq $exclude) { $p.Dispose() }
              }
            }
            return $null
          }
          try {
            $tray=Start-Process -FilePath $launcherPath -WorkingDirectory $root -PassThru
            $deadline=[Diagnostics.Stopwatch]::StartNew()
            while ($deadline.Elapsed.TotalSeconds -lt 25) {
              if ($tray.HasExited) { throw 'Native tray terminated before managed UI launch' }
              $opened=FindGcoUi 0
              if ($opened -and $opened.MainWindowHandle -ne [IntPtr]::Zero) { break }
              if ($opened) { $opened.Dispose(); $opened=$null }
              Start-Sleep -Milliseconds 250
            }
            if (!$opened) { throw 'Native tray did not launch a visible WPF process' }
            $firstPid=$opened.Id
            if (!$opened.CloseMainWindow() -or !$opened.WaitForExit(15000)) {
              throw 'Managed GUI did not close independently of the native tray'
            }
            if ($tray.HasExited) { throw 'Tray exited when WPF GUI was closed' }

            $secondLauncher=Start-Process -FilePath $launcherPath -WorkingDirectory $root -PassThru
            try {
              if (!$secondLauncher.WaitForExit(10000)) {
                throw 'Second invocation did not find the native single-instance tray'
              }
            } finally { $secondLauncher.Dispose() }
            $deadline.Restart()
            while ($deadline.Elapsed.TotalSeconds -lt 25) {
              if ($tray.HasExited) { throw 'Native tray exited before managed UI reopened' }
              $reopened=FindGcoUi $firstPid
              if ($reopened -and $reopened.MainWindowHandle -ne [IntPtr]::Zero) { break }
              if ($reopened) { $reopened.Dispose(); $reopened=$null }
              Start-Sleep -Milliseconds 250
            }
            if (!$reopened) { throw 'Native tray did not reconstruct the WPF UI' }
            if (!$reopened.CloseMainWindow() -or !$reopened.WaitForExit(15000)) {
              throw 'Rebuilt managed WPF GUI did not shut down cleanly'
            }
            if ($tray.HasExited) {
              throw 'Native host exited unexpectedly when the second managed WPF window closed'
            }
            $trayExit=Start-Process -FilePath $launcherPath -ArgumentList '--tray-exit' -WorkingDirectory $root -PassThru
            try {
              if (!$trayExit.WaitForExit(10000) -or $trayExit.ExitCode -ne 0) {
                throw 'Native package-bound tray-exit command could not find its own host'
              }
            } finally { $trayExit.Dispose() }
            if (!$tray.WaitForExit(10000)) {
              throw 'Native tray did not exit cleanly when explicitly requested'
            }
            Write-Host 'PASS real native tray: managed GUI close/unload, singleton reopen, verified native exit'
          }
          finally {
            if ($reopened) {
              if (!$reopened.HasExited) { $reopened.Kill() }
              $reopened.Dispose()
            }
            if ($opened) {
              if (!$opened.HasExited) { $opened.Kill() }
              $opened.Dispose()
            }
            if ($tray) {
              if (!$tray.HasExited) { $tray.Kill() }
              $tray.Dispose()
            }
          }

          # Artifact is a sibling guide plus one portable application folder.
          $release=Split-Path -Parent $root
          if ((Split-Path $root -Leaf) -ne "G's Cyberpunk 2077 Optimization") {
            throw 'Portable app folder name differs from the public contract'
          }
          $guide=Join-Path $release 'START-HERE.txt'
          if (!(Test-Path $guide -PathType Leaf)) { throw 'Missing adjacent quick-start document' }
          if (!(Test-Path (Join-Path $root 'Gs-Cyberpunk2077_Optimizer.exe') -PathType Leaf)) {
            throw 'Public Gs-Cyberpunk2077_Optimizer.exe is missing'
          }
          if (Test-Path (Join-Path $root 'START-HERE.txt')) {
            throw 'Quick-start guide belongs beside the app folder, not inside it'
          }
          Write-Host 'PASS delivery: sibling START-HERE.txt + Gs-Cyberpunk2077_Optimizer.exe'
          Write-Host "PASS finished GCO v$version package and complete owner payload manifest verification"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          # GitHub's downloaded ZIP inherits this artifact name. No nested ZIPs.
          # Run/attempt distinguishes rebuilt archives without bumping GCO.
          name: Gs-Cyberpunk2077_Optimizer-v${{ steps.verify_package.outputs.version }}-run${{ github.run_number }}-a${{ github.run_attempt }}
          path: unified/publish/release/
          if-no-files-found: error
