name: Build unified optimizer shell

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test core read-only contracts
        run: dotnet run --project tests/GTotalOptimizer.Core.Tests/GTotalOptimizer.Core.Tests.csproj --configuration Release
      - name: Publish managed Windows application
        run: dotnet publish src/GTotalOptimizer.App/GTotalOptimizer.App.csproj --configuration Release --runtime win-x64 --self-contained true --output publish-managed -p:PublishSingleFile=false -p:PublishTrimmed=false
      - name: Build CET-style native root launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (dotnet msbuild src/GTotalOptimizer.App/GTotalOptimizer.App.csproj -getProperty:Version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne '1.1.1') { throw "Unexpected app version: $version" }
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path $vswhere -PathType Leaf)) { throw 'vswhere.exe unavailable.' }
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (!$vs) { throw 'C++ toolchain unavailable.' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          New-Item -ItemType Directory -Force 'launcher-build' | Out-Null
          $rcText = (Get-Content 'src/GTotalOptimizer.Launcher/launcher.rc.in' -Raw).Replace('@VERSION_COMMAS@', $version.Replace('.', ',')).Replace('@VERSION_DOTS@', $version)
          Set-Content 'launcher-build/launcher.rc' -Value $rcText -Encoding ASCII
          $source = (Resolve-Path 'src/GTotalOptimizer.Launcher/launcher.c').Path
          $rc = (Resolve-Path 'launcher-build/launcher.rc').Path
          $res = Join-Path (Get-Location) 'launcher-build/launcher.res'
          $obj = Join-Path (Get-Location) 'launcher-build/launcher.obj'
          $exe = Join-Path (Get-Location) 'launcher-build/G-Total-Optimizer.exe'
          $script = Join-Path (Get-Location) 'launcher-build/build.cmd'
          @"
          @echo off
          call "$vcvars" >nul
          if errorlevel 1 exit /b %errorlevel%
          rc.exe /nologo /fo"$res" "$rc"
          if errorlevel 1 exit /b %errorlevel%
          cl.exe /nologo /O2 /MT /DUNICODE /D_UNICODE /Fo:"$obj" "$source" "$res" /link /SUBSYSTEM:WINDOWS user32.lib /OUT:"$exe"
          exit /b %errorlevel%
          "@ | Set-Content $script -Encoding ASCII
          & $script
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $exe -PathType Leaf)) { throw "Root launcher compile failed: $LASTEXITCODE" }
      - name: Stage clean portable package with native root launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (dotnet msbuild src/GTotalOptimizer.App/GTotalOptimizer.App.csproj -getProperty:Version).Trim()
          $root = Join-Path 'publish' "G-Total-Optimizer-v$version"
          $app = Join-Path $root 'app'
          if (Test-Path publish) { Remove-Item publish -Recurse -Force }
          New-Item -ItemType Directory -Force $app | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $root 'RESULTS') | Out-Null
          Copy-Item 'publish-managed/*' $app -Recurse -Force
          Copy-Item 'launcher-build/G-Total-Optimizer.exe' (Join-Path $root 'G-Total-Optimizer.exe')
          Set-Content -LiteralPath (Join-Path $root 'VERSION.txt') -Value $version -NoNewline
          Set-Content -LiteralPath (Join-Path $root 'RESULTS/README.txt') -Value 'Results appear here after backend integration.' -Encoding UTF8
      - name: Verify package layout and versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (dotnet msbuild src/GTotalOptimizer.App/GTotalOptimizer.App.csproj -getProperty:Version).Trim()
          $root = Join-Path 'publish' "G-Total-Optimizer-v$version"
          foreach ($path in @(
            'G-Total-Optimizer.exe', 'VERSION.txt',
            'app/G-Total-Optimizer.App.exe', 'app/GTotalOptimizer.Core.dll',
            'app/coreclr.dll', 'RESULTS/README.txt'
          )) {
            if (!(Test-Path (Join-Path $root $path) -PathType Leaf)) { throw "Missing package file: $path" }
          }
          if (Test-Path (Join-Path $root 'Start G-Total-Optimizer.lnk')) { throw 'Obsolete shortcut must not ship.' }
          if ((Get-ChildItem $root -File -Filter '*.dll').Count -gt 0) { throw 'Root DLL leak.' }
          if ((Get-ChildItem (Join-Path $root 'app') -Recurse -File -Filter coreclr.dll).Count -ne 1) {
            throw 'Expected exactly one bundled runtime.'
          }
          if (Test-Path (Join-Path $root 'components')) { throw 'Unverified profiler components were shipped.' }
          if (Test-Path (Join-Path $root 'CapFrameX.exe')) { throw 'Unverified CapFrameX was shipped.' }
          $v1 = (Get-Item (Join-Path $root 'G-Total-Optimizer.exe')).VersionInfo.FileVersion
          $v2 = (Get-Item (Join-Path $root 'app/G-Total-Optimizer.App.exe')).VersionInfo.FileVersion
          if ($v1 -ne '1.1.1.0' -or $v2 -ne '1.1.1.0') { throw "Version drift: launcher=$v1 app=$v2" }
          $allowed = @('G-Total-Optimizer.exe','VERSION.txt')
          foreach ($name in @(Get-ChildItem $root -File | Select-Object -ExpandProperty Name)) {
            if ($name -notin $allowed) { throw "Unexpected root file: $name" }
          }
          if ((Get-Content (Join-Path $root 'VERSION.txt') -Raw).Trim() -ne $version) {
            throw 'VERSION.txt mismatch.'
          }
          Write-Host "Verified clean v$version portable folder, native launcher and one private runtime."
      - uses: actions/upload-artifact@v4
        with:
          name: G-Total-Optimizer-v1.1.1-Portable-win-x64
          path: publish/
          if-no-files-found: error
