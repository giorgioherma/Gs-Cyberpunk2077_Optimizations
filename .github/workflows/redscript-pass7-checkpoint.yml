name: REDscript Pass 7 - Isolated Chase and Sprint Checkpoint

# Validated in grouped branch-only batches, not individual generator edits.
# One isolated rerun validates all six operations after correcting the absent-source fixture.
# Runs once when this dedicated workflow is first committed or explicitly
# revalidated. No shared-phase CI concurrency and no per-edit automatic runs.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - dev/redscript/pass7
    paths:
      - '.github/workflows/redscript-pass7-checkpoint.yml'

permissions:
  contents: read

concurrency:
  group: redscript-pass7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pass7-source-and-scc:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated Pass 7 implementation
        uses: actions/checkout@v4

      - name: Checkout authoritative post-generic source and CI-only SCC
        uses: actions/checkout@v4
        with:
          repository: giorgioherma/original_cet_source
          ref: main
          token: ${{ secrets.GCET_STACK_SOURCES_TOKEN }}
          persist-credentials: false
          path: .phase2-private
          sparse-checkout: |
            base_after_generic/r6/scripts
            Compiler
          sparse-checkout-cone-mode: true

      - name: Configure .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build isolated generator and complete source-state test runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build tests/Pass7.Checkpoint/Pass7.Checkpoint.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'PASS7_BUILD_FAILED' }

      - name: Test source states and one-run convergence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet run --no-build -c Release --project tests/Pass7.Checkpoint/Pass7.Checkpoint.csproj -- selftest '.phase2-private/base_after_generic'
          if ($LASTEXITCODE -ne 0) { throw 'PASS7_SOURCE_STATE_CONTRACT_FAILED' }

      - name: Generate one independent Pass 7 batch from real post-generic stock
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $game='.phase2-private/base_after_generic'
          $out='.pass7-generated'
          dotnet run --no-build -c Release --project tests/Pass7.Checkpoint/Pass7.Checkpoint.csproj -- generate $game $out
          if ($LASTEXITCODE -ne 0) { throw 'PASS7_CANONICAL_GENERATION_FAILED' }
          $result=Get-Content -LiteralPath (Join-Path $out 'pass7-result.json') -Raw | ConvertFrom-Json
          $changed=@(Get-ChildItem -LiteralPath (Join-Path $out 'r6/scripts') -Recurse -File -Filter '*.reds')
          if ($changed.Count -ne 5 -or [int]$result.appliedEdits -lt 11 -or
              @($result.operations).Count -ne 6 -or
              @($result.operations | Where-Object { $_.status -ne 'APPLIED' }).Count -ne 0) {
            throw ('PASS7_CANONICAL_OWNER_OUTPUT_INCOMPLETE files='+$changed.Count)
          }
          Write-Host ('PASS7 five source-aware owner files, edits='+$result.appliedEdits)

      - name: Verify canonical one-pass generator and independently equal Pass 7 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll'
          $game='.phase2-private/base_after_generic'
          $plan='.pass7-work/plan.json'
          $analysis='.pass7-work/analysis.json'
          $stage='.pass7-production-stage'
          New-Item -ItemType Directory -Force -Path '.pass7-work' | Out-Null
          & dotnet $dll plan-redscript --game $game --out $plan
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $plan)) {
            throw 'PASS7_CANONICAL_PLAN_FAILED'
          }
          $manifest=Get-Content -LiteralPath $plan -Raw | ConvertFrom-Json
          if ([int]$manifest.implementedRuleCount -ne 10 -or
              [string]::IsNullOrWhiteSpace($manifest.sourceStackSha256)) {
            throw 'PASS7_CANONICAL_PLAN_INVALID'
          }
          @{
            schemaVersion='grsp.resolver.input.v1'
            generationAuthorized=$false
            capture=@{ collectionProvenance='GCO_INDEXED_COLLECTED_BYTES_VERIFIED' }
            source=@{ sourceStackSha256=$manifest.sourceStackSha256 }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $analysis -Encoding utf8
          & dotnet $dll stage-redscript-plan --game $game --plan $plan --analysis $analysis --out $stage
          if ($LASTEXITCODE -ne 0) { throw 'PASS7_ONE_PASS_STAGE_FAILED' }
          $staged=Get-Content -LiteralPath (Join-Path $stage 'stage-result.json') -Raw | ConvertFrom-Json
          $targets=@(
            @{ order=700; id='pass7-ncr-spawn-guards'; path='r6/scripts/NightCityRemembers/NCR_SpawnCulling.reds' },
            @{ order=701; id='pass7-stealth-detection-gate'; path='r6/scripts/StealthRunner/npc_puppet.reds' },
            @{ order=702; id='pass7-stealth-player-cache'; path='r6/scripts/StealthRunner/npc_puppet.reds' },
            @{ order=703; id='pass7-runningman-double-sprint'; path='r6/scripts/RunningMan/double_sprint.reds' },
            @{ order=704; id='pass7-runningman-direction'; path='r6/scripts/RunningMan/sprint_direction.reds' },
            @{ order=705; id='pass7-lizzies-performer-gate'; path='r6/scripts/LizziesBDs/NPCPuppet.reds' }
          )
          foreach($target in $targets) {
            $matches=@($staged.completed | Where-Object { $_.id -eq $target.id })
            if ($matches.Count -ne 1 -or [int]$matches[0].order -ne $target.order -or
                [int]$matches[0].rewrittenExpressions -lt 1) {
              throw ('PASS7_CANONICAL_STAGE_OWNER_MISSING:'+ $target.id)
            }
            $independent=Join-Path '.pass7-generated' $target.path
            $canonical=Join-Path (Join-Path $stage 'effective-preview') $target.path
            if (!(Test-Path -LiteralPath $independent -PathType Leaf) -or
                !(Test-Path -LiteralPath $canonical -PathType Leaf) -or
                (Get-FileHash -LiteralPath $independent -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $canonical -Algorithm SHA256).Hash) {
              throw ('PASS7_CANONICAL_ONE_PASS_BYTE_PARITY_DIFF:'+ $target.id)
            }
          }
          Write-Host 'PASS Pass 7 production one-pass: six operations in five independently composed source files and exact output parity'

      - name: Official SCC 0.5.31 on module-safe full canonical one-pass output
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./tests/GRedscript.Resolver.Tests/Verify-Phase2Checkpoint.ps1 `
            -PostGenericRoot '.phase2-private/base_after_generic' `
            -CompilerRoot '.phase2-private/Compiler' `
            -ResolverDll 'src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll' `
            -SemanticOverlayRoot '.pass7-production-stage/effective-preview'
          if (!$?) { throw 'PASS7_FULL_ONE_PASS_OFFICIAL_SCC_FAILED' }

      - name: Remove source and SCC fixtures
        if: always()
        shell: pwsh
        run: |
          foreach($item in @('.phase2-private','.pass7-generated','.pass7-production-stage','.pass7-work')) {
            if(Test-Path -LiteralPath $item) {
              Remove-Item -LiteralPath $item -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
