            $grsHub=@($result.completed | Where-Object { $_.id -eq 'gear-recovery-input-hub' })
            $grsHubRel='r6/scripts/GearRecoverySystem/25_GRSInteractionController.reds'
            $grsHubRef=Join-Path $env:PHASE2_GRS_INPUT_OUTPUT $grsHubRel
            $grsHubActual=Join-Path (Join-Path $stage 'effective-preview') $grsHubRel
            if ($grsHub.Count -ne 1 -or [int]$grsHub[0].order -ne 32 -or
                [int]$grsHub[0].rewrittenExpressions -lt 3 -or
                !(Test-Path -LiteralPath $grsHubActual -PathType Leaf) -or
                !(Test-Path -LiteralPath $grsHubRef -PathType Leaf)) {
              throw 'PHASE2_GRS_HUB_SOURCE_OR_STAGE_MISSING'
            }
            # #36 subsequently edits the same GRS owner file. Preserve #32
            # held-action consumption, runtime subscription and engine fallback.
            # The exact resulting bytes are checked against the independently
            # composed #32 -> #36 file in PHASE2_GRS_POLL_ONE_PASS_BYTE_PARITY_DIFF.
            $grsInputFinal=Get-Content -LiteralPath $grsHubActual -Raw
            $grsInputRef=Get-Content -LiteralPath $grsHubRef -Raw
            foreach($invariant in @(
                'class GRSRecoverInputListener extends InputListener',
                'this.GRSPerformRecover();',
                'm_grsFallbackRegistered',
                'this.m_grsInputHub.Unsubscribe(this.m_grsInputSubscription);')) {
              if (!$grsInputRef.Contains($invariant,[StringComparison]::Ordinal) -or
                  !$grsInputFinal.Contains($invariant,[StringComparison]::Ordinal)) {
                throw ('PHASE2_GRS_INPUT_LOST_AFTER_POLL:'+ $invariant)
              }
            }
            $dd=@($result.completed | Where-Object { $_.id -eq 'drugdealer-input-hub' })
            if ($dd.Count -ne 5 -or @($dd | Where-Object { [int]$_.order -ne 33 }).Count -ne 0) {
              throw 'PHASE2_DD_INPUT_STAGE_COUNT_OR_ORDER_DIFF'
            }
            foreach($rel in @(
                'r6/scripts/DrugDealer/Crackhouse/Crackhouse.reds',
                'r6/scripts/DrugDealer/Job/SellDrugs/Interaction.reds',
                'r6/scripts/DrugDealer/Lab/Lab.reds',
                'r6/scripts/DrugDealer/NightMarket/NightMarket.reds',
                'r6/scripts/DrugDealer/Operation/OperationProximity.reds')) {
              $ref=Join-Path $env:PHASE2_DRUGDEALER_INPUT_OUTPUT $rel
              $actual=Join-Path (Join-Path $stage 'effective-preview') $rel
              if (!(Test-Path -LiteralPath $actual -PathType Leaf) -or
                  (Get-FileHash -LiteralPath $actual -Algorithm SHA256).Hash -ne
                  (Get-FileHash -LiteralPath $ref -Algorithm SHA256).Hash) {
                throw ('PHASE2_DD_INPUT_ONE_PASS_BYTE_DIFF:'+ $rel)
              }
            }
            $ncr=@($result.completed | Where-Object { $_.id -eq 'ncr-maintenance-scheduler' })
            $ncrRel='r6/scripts/NightCityRemembers/NCR.reds'
            $ncrRef=Join-Path $env:PHASE2_NCR_TICK_OUTPUT $ncrRel
            $ncrActual=Join-Path (Join-Path $stage 'effective-preview') $ncrRel
            if ($ncr.Count -ne 1 -or [int]$ncr[0].order -ne 34 -or
                [int]$ncr[0].rewrittenExpressions -lt 5 -or
                !(Test-Path -LiteralPath $ncrActual -PathType Leaf) -or
                (Get-FileHash -LiteralPath $ncrActual -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $ncrRef -Algorithm SHA256).Hash) {
              throw 'PHASE2_NCR_ONE_PASS_BYTE_PARITY_DIFF'
            }
            $scJobs=@($result.completed | Where-Object { $_.id -eq 'shattered-chrome-periodic-jobs' })
            $scRel='r6/scripts/ShatteredChrome/SC.reds'
            $scRef=Join-Path $env:PHASE2_SC_JOBS_OUTPUT $scRel
            $scActual=Join-Path (Join-Path $stage 'effective-preview') $scRel
            if ($scJobs.Count -ne 1 -or [int]$scJobs[0].order -ne 35 -or
                [int]$scJobs[0].rewrittenExpressions -lt 5 -or
                !(Test-Path -LiteralPath $scActual -PathType Leaf) -or
                (Get-FileHash -LiteralPath $scActual -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $scRef -Algorithm SHA256).Hash) {
              throw 'PHASE2_SC_JOBS_ONE_PASS_BYTE_PARITY_DIFF'
            }
            $grsPoll=@($result.completed | Where-Object { $_.id -eq 'gear-recovery-poll-scheduler' })
            $grsPollRel='r6/scripts/GearRecoverySystem/25_GRSInteractionController.reds'
            $grsPollRef=Join-Path $env:PHASE2_GRS_POLL_OUTPUT $grsPollRel
            $grsPollActual=Join-Path (Join-Path $stage 'effective-preview') $grsPollRel
            if ($grsPoll.Count -ne 1 -or [int]$grsPoll[0].order -ne 36 -or
                [int]$grsPoll[0].rewrittenExpressions -lt 5 -or
                !(Test-Path -LiteralPath $grsPollActual -PathType Leaf) -or
                !(Test-Path -LiteralPath $grsPollRef -PathType Leaf)) {
              throw 'PHASE2_GRS_POLL_STAGE_OUTPUT_MISSING'
            }
            # #40 additionally reuses GRS player/blackboard getters in the
            # same owner file. Preserve the #36 callback registration and
            # original fallback; verify exact composed final bytes via #40.
            $grsPollContents=Get-Content -LiteralPath $grsPollActual -Raw
            foreach($witness in @(
                'GRSGCOInteractionPollJob extends ScheduledJob',
                'grsScheduler.Register(grsJob)',
                'new GRSInteractionPollCallback()',
                'this.m_gcoGrsPollScheduler.Unregister(this.m_gcoGrsPollID)')) {
              if(!$grsPollContents.Contains($witness,[StringComparison]::Ordinal)){
                throw ('PHASE2_GRS_POLL_WITNESS_LOST_AFTER_STATE:'+ $witness)
              }
            }
            $vm=@($result.completed | Where-Object { $_.id -eq 'vehicle-mileage-scheduler' })
            if($vm.Count -ne 4 -or @($vm | Where-Object { [int]$_.order -ne 37 }).Count -ne 0){
              throw 'PHASE2_VM_STAGE_COUNT_ORDER_MISSING'
            }
            foreach($filename in @('VM3DOdoHUD.reds','VMFuelAvailable.reds','VMFuelGauge.reds','VMPriceSign.reds')){
              $rel='r6/scripts/VehicleMileage/UI/'+$filename
              $actual=Join-Path (Join-Path $stage 'effective-preview') $rel
              $expected=Join-Path $env:PHASE2_VM_OUTPUT $rel
              if(!(Test-Path -LiteralPath $actual -PathType Leaf) -or
                 !(Test-Path -LiteralPath $expected -PathType Leaf) -or
                 (Get-FileHash -LiteralPath $actual -Algorithm SHA256).Hash -ne
                 (Get-FileHash -LiteralPath $expected -Algorithm SHA256).Hash){
                throw ('PHASE2_VM_ONE_PASS_BYTE_PARITY_DIFF:'+ $filename)
              }
            }
            $sr=@($result.completed | Where-Object { $_.id -eq 'stealth-runner-pickpocket-input' })
            $srRel='r6/scripts/StealthRunner/Pickpocket/Choice.reds'
            $srExpected=Join-Path $env:PHASE2_SR_INPUT_OUTPUT $srRel
            $srActual=Join-Path (Join-Path $stage 'effective-preview') $srRel
            if($sr.Count -ne 1 -or [int]$sr[0].order -ne 38 -or
                [int]$sr[0].rewrittenExpressions -lt 4 -or
                !(Test-Path -LiteralPath $srActual -PathType Leaf) -or
                (Get-FileHash -LiteralPath $srActual -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $srExpected -Algorithm SHA256).Hash){
              throw 'PHASE2_SR_INPUT_ONE_PASS_BYTE_PARITY_DIFF'
            }
            $cw=@($result.completed | Where-Object { $_.id -eq 'cyberware-ex-input-hub' })
            $cwRel='r6/scripts/CyberwareEx/CyberwareEx.Global.reds'
            $cwRef=Join-Path $env:PHASE2_CW_INPUT_OUTPUT $cwRel
            $cwActual=Join-Path (Join-Path $stage 'effective-preview') $cwRel
            if($cw.Count -ne 1 -or [int]$cw[0].order -ne 39 -or
               [int]$cw[0].rewrittenExpressions -lt 3 -or
               !(Test-Path -LiteralPath $cwActual -PathType Leaf) -or
               (Get-FileHash -LiteralPath $cwActual -Algorithm SHA256).Hash -ne
               (Get-FileHash -LiteralPath $cwRef -Algorithm SHA256).Hash){
              throw 'PHASE2_CW_INPUT_ONE_PASS_BYTE_PARITY_DIFF'
            }
            $grsState=@($result.completed | Where-Object { $_.id -eq 'gear-recovery-statecache' })
            $grsRel='r6/scripts/GearRecoverySystem/25_GRSInteractionController.reds'
            $grsExpected=Join-Path $env:PHASE2_GRS_STATE_OUTPUT $grsRel
            $grsActual=Join-Path (Join-Path $stage 'effective-preview') $grsRel
            if($grsState.Count -ne 1 -or [int]$grsState[0].order -ne 40 -or
               [int]$grsState[0].rewrittenExpressions -lt 3 -or
               !(Test-Path -LiteralPath $grsActual -PathType Leaf) -or
               (Get-FileHash -LiteralPath $grsActual -Algorithm SHA256).Hash -ne
               (Get-FileHash -LiteralPath $grsExpected -Algorithm SHA256).Hash){
              throw 'PHASE2_GRS_STATE_ONE_PASS_BYTE_PARITY_DIFF'
            }
            $vcp=@($result.completed | Where-Object { $_.id -eq 'vehicle-call-quest-reuse' })
            $vcpRel='r6/scripts/Vehicle Call Plus/VehicleCall_FastTravel.reds'
            $vcpExpected=Join-Path $env:PHASE2_VCP_OUTPUT $vcpRel
            $vcpActual=Join-Path (Join-Path $stage 'effective-preview') $vcpRel
            if($vcp.Count -ne 1 -or [int]$vcp[0].order -ne 41 -or
               [int]$vcp[0].rewrittenExpressions -lt 6 -or
               !(Test-Path -LiteralPath $vcpActual -PathType Leaf) -or
               (Get-FileHash -LiteralPath $vcpActual -Algorithm SHA256).Hash -ne
               (Get-FileHash -LiteralPath $vcpExpected -Algorithm SHA256).Hash){
              throw 'PHASE2_VCP_ONE_PASS_BYTE_PARITY_DIFF'
            }
            $reference=Join-Path $env:PHASE2_DPAD_OUTPUT 'r6/scripts/custom_quickslots/player_puppet.reds'
            $output=Join-Path $stage 'effective-preview/r6/scripts/custom_quickslots/player_puppet.reds'
            if (!(Test-Path -LiteralPath $output -PathType Leaf) -or
                !(Test-Path -LiteralPath $reference -PathType Leaf)) {
              throw 'PHASE2_CQ_POSTGENERIC_SOURCE_MISSING'
            }
            if ((Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $reference -Algorithm SHA256).Hash) {
              throw 'PHASE2_CQ_POSTGENERIC_ORDERED_SOURCE_DIFF'
            }
            $contents=Get-Content -LiteralPath $output -Raw
            if (!$contents.Contains('GRSP-GENERIC:CNAME_ARRAY_MEMBERSHIP_V1') -or
                !$contents.Contains('this.customQuickslotsFallbackRegistered = true;') -or
                !$contents.Contains('this.customQuickslotsInputHub.UnsubscribeDevice(') -or
                !$contents.Contains('!this.player.PlayerLastUsedPad()') -or
                !$contents.Contains('this.RecomputeDpadProhibitions();')) {
              throw 'PHASE2_CQ_POSTGENERIC_GENERIC_OR_INPUT_STATE_LOST'
            }
            Write-Host 'PASS GCO real post-generic one-pass Stage: Quickslots InputHub #16 and D-pad #17 applied automatically; original PlayerLastUsedPad and generic preserved; independent bytes equal'

          }
          finally {
            if (Test-Path -LiteralPath $work) {
              Remove-Item -LiteralPath $work -Recurse -Force
            }
          }

      - name: Checkpoint - compile post-generic plus real semantic overlay
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./tests/GRedscript.Resolver.Tests/Verify-Phase2Checkpoint.ps1 -PostGenericRoot '.phase2-private/base_after_generic' -CompilerRoot '.phase2-private/Compiler' -ResolverDll 'src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll' -SemanticOverlayRoot $env:PHASE2_OUTPUT
          if (!$?) { throw 'PHASE2_CHECKPOINT_FAILED' }

      - name: Remove private source and compiler after validation
        if: always()
        shell: pwsh
        run: |
          foreach ($path in @('.phase2-private', $env:PHASE2_OUTPUT, $env:PHASE2_DARK_OUTPUT, $env:PHASE2_ICON_OUTPUT, $env:PHASE2_FE_OUTPUT, $env:PHASE2_FE_PINS_OUTPUT, $env:PHASE2_QUICKSLOTS_OUTPUT, $env:PHASE2_DPAD_OUTPUT, $env:PHASE2_QUICKHACK_OUTPUT, $env:PHASE2_REDWINDOWS_OUTPUT, $env:PHASE2_TRIGGER_OUTPUT, $env:PHASE2_DPR_OUTPUT, $env:PHASE2_HOLOGIRL_OUTPUT, $env:PHASE2_RW_CURSORS_OUTPUT, $env:PHASE2_RW_RENDER_OUTPUT, $env:PHASE2_DF_AGGRESSIVE_OUTPUT, $env:PHASE2_RW_SETTERS_OUTPUT, $env:PHASE2_DVC_UI_OUTPUT, $env:PHASE2_BROWSER_JOURNAL_OUTPUT, $env:PHASE2_BROWSER_INPUT_OUTPUT, $env:PHASE2_EVS_PS_OUTPUT, $env:PHASE2_FE_HUB_OUTPUT, $env:PHASE2_GRS_INPUT_OUTPUT, $env:PHASE2_DRUGDEALER_INPUT_OUTPUT, $env:PHASE2_NCR_TICK_OUTPUT, $env:PHASE2_SC_JOBS_OUTPUT, $env:PHASE2_GRS_POLL_OUTPUT, $env:PHASE2_VM_OUTPUT, $env:PHASE2_SR_INPUT_OUTPUT, $env:PHASE2_CW_INPUT_OUTPUT, $env:PHASE2_GRS_STATE_OUTPUT, $env:PHASE2_VCP_OUTPUT)) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Force -Recurse
            }
          }
