name: REDscript Phase 2 - Post-generic checkpoint

# Chronological GCO generation checkpoints:
# 1. Generic source optimization (existing owner CI).
# 2. This focused Phase 2 checkpoint on already-generic source.
# Future semantic generator changes extend this same checkpoint.
# No CET capture replay, WPF packaging, second compiler or game writes.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ci/redscript-phase2-postgeneric
      - dev/redscript/resolver_handoff
    paths:
      - '.github/workflows/redscript-phase2-checkpoint.yml'
      - 'tests/GRedscript.Resolver.Tests/Verify-Phase2Checkpoint.ps1'
      - 'src/GRedscript.Resolver/**'
      - 'tests/GRedscript.Resolver.Tests/test_phase2_*.py'

permissions:
  contents: read

concurrency:
  group: redscript-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  post-generic:
    name: Phase 2 checkpoint - SCC
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PHASE2_OUTPUT: ${{ runner.temp }}/gco-phase2-generated
    steps:
      - name: Checkout GCO REDscript resolver
        uses: actions/checkout@v4

      - name: Checkout already-generic private source and CI-only SCC inputs
        uses: actions/checkout@v4
        with:
          repository: giorgioherma/original_cet_source
          ref: main
          token: ${{ secrets.GCET_STACK_SOURCES_TOKEN }}
          persist-credentials: false
          path: .phase2-private
          sparse-checkout: |
            base_after_generic/r6/scripts
            Compiler
          sparse-checkout-cone-mode: true

      - name: Configure .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure Python for semantic source-state contracts
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the existing SCC owner CLI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build src/GRedscript.Resolver/GRSP.Resolver.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_RESOLVER_BUILD_FAILED' }

      - name: Validate DigitalVixenCore Footsteps semantic source states
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m unittest discover -s tests/GRedscript.Resolver.Tests -p 'test_phase2_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_SEMANTIC_SOURCE_STATE_TEST_FAILED' }

      - name: Generate Footsteps semantic overlay from post-generic stock
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & dotnet src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll phase2-footsteps --game '.phase2-private/base_after_generic' --out $env:PHASE2_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_SEMANTIC_GENERATOR_FAILED' }
          $report=Get-Content -LiteralPath (Join-Path $env:PHASE2_OUTPUT 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($report.ruleId -ne 'DVCORE_FOOTSTEPS_REFLECTION_SUCCESS_CACHE_V1' -or
              $report.status -ne 'APPLIED' -or $report.appliedEdits -ne 1) {
            throw ('PHASE2_SEMANTIC_STOCK_OUTPUT_MISSING: '+$report.status)
          }

      - name: Checkpoint - compile post-generic plus real semantic overlay
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./tests/GRedscript.Resolver.Tests/Verify-Phase2Checkpoint.ps1 -PostGenericRoot '.phase2-private/base_after_generic' -CompilerRoot '.phase2-private/Compiler' -ResolverDll 'src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll' -SemanticOverlayRoot $env:PHASE2_OUTPUT
          if (!$?) { throw 'PHASE2_CHECKPOINT_FAILED' }

      - name: Remove private source and compiler after validation
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath '.phase2-private') {
            Remove-Item -LiteralPath '.phase2-private' -Force -Recurse
          }
