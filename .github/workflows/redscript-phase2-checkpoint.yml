name: REDscript Phase 2 - Post-generic checkpoint

# Chronological GCO generation checkpoints:
# 1. Generic source optimization (existing owner CI).
# 2. This focused Phase 2 checkpoint on already-generic source.
# Future semantic generator changes extend this same checkpoint.
# No CET capture replay, WPF packaging, second compiler or game writes.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ci/redscript-phase2-postgeneric
      - dev/redscript/resolver_handoff
    paths:
      - '.github/workflows/redscript-phase2-checkpoint.yml'
      - 'tests/GRedscript.Resolver.Tests/Verify-Phase2Checkpoint.ps1'
      - 'src/GRedscript.Resolver/**'
      - 'tests/GRedscript.Resolver.Tests/test_phase2_*.py'

permissions:
  contents: read

concurrency:
  group: redscript-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  post-generic:
    name: Phase 2 checkpoint - SCC
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PHASE2_OUTPUT: ${{ github.workspace }}/.phase2-generated
      PHASE2_DARK_OUTPUT: ${{ github.workspace }}/.phase2-darkfuture
      PHASE2_ICON_OUTPUT: ${{ github.workspace }}/.phase2-darkfuture-icons
      PHASE2_FE_OUTPUT: ${{ github.workspace }}/.phase2-fe-input
      PHASE2_FE_PINS_OUTPUT: ${{ github.workspace }}/.phase2-fe-pins
      PHASE2_QUICKSLOTS_OUTPUT: ${{ github.workspace }}/.phase2-cq-input
      PHASE2_DPAD_OUTPUT: ${{ github.workspace }}/.phase2-cq-dpad
      PHASE2_QUICKHACK_OUTPUT: ${{ github.workspace }}/.phase2-qhf-tags
      PHASE2_REDWINDOWS_OUTPUT: ${{ github.workspace }}/.phase2-redwindows-find
      PHASE2_TRIGGER_OUTPUT: ${{ github.workspace }}/.phase2-trigger-tags
      PHASE2_DPR_OUTPUT: ${{ github.workspace }}/.phase2-dpr-tracing
      PHASE2_HOLOGIRL_OUTPUT: ${{ github.workspace }}/.phase2-hologirl-material
    steps:
      - name: Checkout GCO REDscript resolver
        uses: actions/checkout@v4

      - name: Checkout already-generic private source and CI-only SCC inputs
        uses: actions/checkout@v4
        with:
          repository: giorgioherma/original_cet_source
          ref: main
          token: ${{ secrets.GCET_STACK_SOURCES_TOKEN }}
          persist-credentials: false
          path: .phase2-private
          sparse-checkout: |
            base_after_generic/r6/scripts
            Compiler
          sparse-checkout-cone-mode: true

      - name: Configure .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure Python for semantic source-state contracts
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the existing SCC owner CLI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build src/GRedscript.Resolver/GRSP.Resolver.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_RESOLVER_BUILD_FAILED' }

      - name: Validate DigitalVixenCore Footsteps semantic source states
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m unittest discover -s tests/GRedscript.Resolver.Tests -p 'test_phase2_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_SEMANTIC_SOURCE_STATE_TEST_FAILED' }

      - name: Generate Footsteps semantic overlay from post-generic stock
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & dotnet src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll phase2-footsteps --game '.phase2-private/base_after_generic' --out $env:PHASE2_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_SEMANTIC_GENERATOR_FAILED' }
          $report=Get-Content -LiteralPath (Join-Path $env:PHASE2_OUTPUT 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($report.ruleId -ne 'DVCORE_FOOTSTEPS_REFLECTION_SUCCESS_CACHE_V1' -or
              $report.status -ne 'APPLIED' -or $report.appliedEdits -ne 1) {
            throw ('PHASE2_SEMANTIC_STOCK_OUTPUT_MISSING: '+$report.status)
          }

      - name: Generate Dark Future safe tag cache after Footsteps
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & dotnet src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll phase2-dark-future --game '.phase2-private/base_after_generic' --base-overlay $env:PHASE2_OUTPUT --out $env:PHASE2_DARK_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_DARK_FUTURE_GENERATOR_FAILED' }
          $report=Get-Content -LiteralPath (Join-Path $env:PHASE2_DARK_OUTPUT 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($report.ruleId -ne 'DARK_FUTURE_INFINITE_TAG_CACHE_V1' -or
              $report.status -ne 'APPLIED' -or [int]$report.appliedEdits -ne 1) {
            throw ('PHASE2_DARK_FUTURE_STOCK_OUTPUT_MISSING: '+$report.status+' '+$report.reason)
          }
          $src=Join-Path $env:PHASE2_DARK_OUTPUT 'r6/scripts'
          $dst=Join-Path $env:PHASE2_OUTPUT 'r6/scripts'
          $files=@(Get-ChildItem -LiteralPath $src -Recurse -File -Filter '*.reds')
          if ($files.Count -ne 1) { throw 'PHASE2_DARK_FUTURE_EXPECTED_ONE_SOURCE' }
          foreach ($file in $files) {
            $rel=[IO.Path]::GetRelativePath($src, $file.FullName)
            if ([IO.Path]::IsPathRooted($rel) -or $rel.StartsWith('..')) {
              throw 'PHASE2_DARK_FUTURE_SOURCE_PATH_UNSAFE'
            }
            $target=Join-Path $dst $rel
            if (Test-Path -LiteralPath $target) {
              throw 'PHASE2_DARK_FUTURE_OWNER_FILE_COLLISION'
            }
            New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $target
          }
          Write-Host 'PASS Phase 2 combined semantic overlay: DVCore=1 DarkFuture=1'

      - name: Generate 400ms Dark Future status icon cadence after tag cache
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll'
          & dotnet $dll phase2-dark-future-icons --game '.phase2-private/base_after_generic' --base-overlay $env:PHASE2_OUTPUT --out $env:PHASE2_ICON_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_DF_ICON_GENERATOR_FAILED' }
          $report=Get-Content -LiteralPath (Join-Path $env:PHASE2_ICON_OUTPUT 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($report.ruleId -ne 'DARK_FUTURE_STATUS_ICON_400MS_V1' -or
              $report.status -ne 'APPLIED' -or [int]$report.appliedEdits -ne 1) {
            throw ('PHASE2_DF_ICON_NOT_APPLIED: '+$report.status+' '+$report.reason)
          }
          $source=Join-Path $env:PHASE2_ICON_OUTPUT 'r6/scripts'
          $dest=Join-Path $env:PHASE2_OUTPUT 'r6/scripts'
          $files=@(Get-ChildItem -LiteralPath $source -Recurse -File -Filter '*.reds')
          if ($files.Count -ne 1) { throw 'PHASE2_DF_ICON_EXPECTED_ONE_SOURCE' }
          foreach ($file in $files) {
            $relative=[IO.Path]::GetRelativePath($source,$file.FullName)
            if ([IO.Path]::IsPathRooted($relative) -or $relative.StartsWith('..')) {
              throw 'PHASE2_DF_ICON_PATH_ESCAPE'
            }
            $target=Join-Path $dest $relative
            if (!(Test-Path -LiteralPath $target -PathType Leaf)) {
              throw 'PHASE2_DF_ICON_DID_NOT_COMPOSE_AFTER_TAG_CACHE'
            }
            $old=Get-Content -LiteralPath $target -Raw
            $new=Get-Content -LiteralPath $file.FullName -Raw
            if (!$old.Contains('m_gcoDfInfiniteTagValid') -or
                !$new.Contains('m_gcoDfInfiniteTagValid') -or
                !$new.Contains('DarkFutureCanHideOnBuffBar') -or
                !$new.Contains('now + 0.40')) {
              throw 'PHASE2_DF_ICON_CROSS_SEMANTIC_PROOF_FAILED'
            }
            foreach ($m in @([regex]::Matches($old,
              '(?:GCO|GRSP)-GENERIC:[A-Z0-9_]+') | ForEach-Object Value |
                Sort-Object -Unique)) {
              if (!$new.Contains($m,[StringComparison]::Ordinal)) {
                throw 'PHASE2_DF_ICON_DROPPED_GENERIC_SOURCE'
              }
            }
            Copy-Item -LiteralPath $file.FullName -Destination $target -Force
          }
          Write-Host 'PASS three semantic operations compose in two owner source files'

      - name: Generate FE early-input guard after generic and existing semantics
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll'
          & dotnet $dll phase2-fe-input --game '.phase2-private/base_after_generic' --base-overlay $env:PHASE2_OUTPUT --out $env:PHASE2_FE_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_FE_GENERATOR_FAILED' }
          $report=Get-Content -LiteralPath (Join-Path $env:PHASE2_FE_OUTPUT 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($report.ruleId -ne 'FLUSHING_ETIQUETTE_UNRELATED_INPUT_GATE_V1' -or
              $report.status -ne 'APPLIED' -or [int]$report.appliedEdits -ne 1) {
            throw ('PHASE2_FE_INPUT_EXPECTED_APPLIED: '+$report.status+' '+$report.reason)
          }
          $source=Join-Path $env:PHASE2_FE_OUTPUT 'r6/scripts'
          $dest=Join-Path $env:PHASE2_OUTPUT 'r6/scripts'
          $files=@(Get-ChildItem -LiteralPath $source -File -Recurse -Filter '*.reds')
          if ($files.Count -ne 1) { throw 'PHASE2_FE_EXPECTED_ONE_SOURCE' }
          foreach ($file in $files) {
            $rel=[IO.Path]::GetRelativePath($source,$file.FullName)
            if ([IO.Path]::IsPathRooted($rel) -or $rel.StartsWith('..')) {
              throw 'PHASE2_FE_SOURCE_PATH_UNSAFE'
            }
            $target=Join-Path $dest $rel
            if (Test-Path -LiteralPath $target -PathType Leaf) {
              throw 'PHASE2_FE_DID_NOT_EXPECT_OWNER_COLLISION'
            }
            $now=Get-Content -LiteralPath $file.FullName -Raw
            if (!$now.Contains('GCO-GENERIC:CNAME_FIXED_INDEX_V1') -or
                !$now.Contains('return wrappedMethod(action, consumer);') -or
                !$now.Contains('ListenerAction.GetType(action)')) {
              throw 'PHASE2_FE_LOST_GENERIC_OR_ONACTION_FALLBACK'
            }
            New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $target
          }
          Write-Host 'PASS four approved semantic operations compose after generic source'

      - name: Generate game-tested FE session pins and minimize global UI work
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll'
          & dotnet $dll phase2-fe-pins --game '.phase2-private/base_after_generic' --base-overlay $env:PHASE2_OUTPUT --out $env:PHASE2_FE_PINS_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_FE_PINS_GENERATOR_FAILED' }
          $report=Get-Content -LiteralPath (Join-Path $env:PHASE2_FE_PINS_OUTPUT 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($report.ruleId -ne 'FE_SESSION_WASHROOM_PINS_V1' -or
              $report.status -ne 'APPLIED' -or
              [int]$report.appliedEdits -ne 1 -or
              @($report.sourcePaths).Count -ne 2) {
            throw ('PHASE2_FE_PINS_EXPECTED_TWO_FILES: '+$report.status+' '+$report.reason)
          }
          $src=Join-Path $env:PHASE2_FE_PINS_OUTPUT 'r6/scripts'
          $dst=Join-Path $env:PHASE2_OUTPUT 'r6/scripts'
          $files=@(Get-ChildItem -LiteralPath $src -Recurse -File -Filter '*.reds')
          if ($files.Count -ne 2) { throw 'PHASE2_FE_PINS_TWO_SOURCE_FILES_REQUIRED' }
          foreach($file in $files) {
            $rel=[IO.Path]::GetRelativePath($src,$file.FullName)
            if ([IO.Path]::IsPathRooted($rel) -or $rel.StartsWith('..')) {
              throw 'PHASE2_FE_PINS_PATH_ESCAPE'
            }
            $target=Join-Path $dst $rel
            if (Test-Path -LiteralPath $target) {
              $before=Get-Content -LiteralPath $target -Raw
              $after=Get-Content -LiteralPath $file.FullName -Raw
              foreach($marker in @([regex]::Matches($before,
                  '(?:GCO|GRSP)-GENERIC:[A-Z0-9_]+') |
                  ForEach-Object Value | Sort-Object -Unique)) {
                if (!$after.Contains($marker,[StringComparison]::Ordinal)) {
                  throw 'PHASE2_FE_PINS_DROPPED_GENERIC_SOURCE'
                }
              }
            } else {
              New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
            }
            Copy-Item -LiteralPath $file.FullName -Destination $target -Force
          }
          $places=@(Get-ChildItem -LiteralPath $dst -Recurse -File -Filter 'FE_Places.reds')
          $owner=@(Get-ChildItem -LiteralPath $dst -Recurse -File -Filter 'FlushingEtiquette.reds')
          if ($places.Count -ne 1 -or $owner.Count -ne 1) {
            throw 'PHASE2_FE_PINS_OWNER_OUTPUT_NOT_UNIQUE'
          }
          $pins=Get-Content -LiteralPath $places[0].FullName -Raw
          $system=Get-Content -LiteralPath $owner[0].FullName -Raw
          if (!$pins.Contains('class FEWashroomMappinService') -or
              !$pins.Contains('mappins.SetMappinActive(id, true);') -or
              !$pins.Contains('MinimapPOIMappinController') -or
              $pins.Contains('@wrapMethod(BaseMinimapMappinController)') -or
              !$system.Contains('FEWashroomMappinService.Get(this.GetGameInstance())') -or
              $system.Contains('FEPlaces.UnregisterPins(gi, this.m_pins);')) {
            throw 'PHASE2_FE_PINS_HANDMADE_LIFECYCLE_POSTCONDITION_FAILED'
          }
          Write-Host 'PASS FE session-owned pin lifecycle, explicit activation and targeted icon styling'

      - name: Generate source-aware Quickslots specific input bridge with engine fallback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll'
          & dotnet $dll phase2-quickslots-input --game '.phase2-private/base_after_generic' --base-overlay $env:PHASE2_OUTPUT --out $env:PHASE2_QUICKSLOTS_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_CQ_INPUT_GENERATOR_FAILED' }
          $report=Get-Content -LiteralPath (Join-Path $env:PHASE2_QUICKSLOTS_OUTPUT 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($report.ruleId -ne 'CUSTOM_QUICKSLOTS_SPECIFIC_INPUT_BRIDGE_V1' -or
              $report.status -ne 'APPLIED' -or [int]$report.appliedEdits -ne 1) {
            throw ('PHASE2_CQ_INPUT_EXPECTED_APPLIED: '+$report.status+' '+$report.reason)
          }
          $src=Join-Path $env:PHASE2_QUICKSLOTS_OUTPUT 'r6/scripts'
          $dst=Join-Path $env:PHASE2_OUTPUT 'r6/scripts'
          $files=@(Get-ChildItem -LiteralPath $src -Recurse -File -Filter '*.reds')
          if ($files.Count -ne 1) { throw 'PHASE2_CQ_ONE_OWNER_FILE_REQUIRED' }
          foreach($file in $files) {
            $rel=[IO.Path]::GetRelativePath($src,$file.FullName)
            if ([IO.Path]::IsPathRooted($rel) -or $rel.StartsWith('..')) {
              throw 'PHASE2_CQ_INPUT_PATH_ESCAPE'
            }
            $target=Join-Path $dst $rel
            $updated=Get-Content -LiteralPath $file.FullName -Raw
            if (!$updated.Contains('class CustomQuickslotsGlobalInputListener extends InputListener') -or
                !$updated.Contains('class CustomQuickslotsDeviceListener extends InputDeviceListener') -or
                !$updated.Contains('this.customQuickslotsInputHub.Subscribe(') -or
                !$updated.Contains('this.customQuickslotsInputHub.SubscribeDevice(') -or
                !$updated.Contains('this.customQuickslotsInputHub.UnsubscribeDevice(') -or
                !$updated.Contains('this.customQuickslotsFallbackRegistered = true;') -or
                !$updated.Contains('GRSP-GENERIC:CNAME_ARRAY_MEMBERSHIP_V1') -or
                !$updated.Contains('this.player.m_customHotkeyPlayerButtonData.ObserveAction(')) {
              throw 'PHASE2_CQ_INPUT_GENERIC_OR_FALLBACK_DROPPED'
            }
            if (Test-Path -LiteralPath $target) {
              $old=Get-Content -LiteralPath $target -Raw
              foreach($marker in @([regex]::Matches($old,
                  '(?:GCO|GRSP)-GENERIC:[A-Z0-9_]+') |
                  ForEach-Object Value | Sort-Object -Unique)) {
                if (!$updated.Contains($marker,[StringComparison]::Ordinal)) {
                  throw 'PHASE2_CQ_INPUT_LOST_GENERIC'
                }
              }
            } else {
              New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
            }
            Copy-Item -LiteralPath $file.FullName -Destination $target -Force
          }
          Write-Host 'PASS Quickslots InputHub action-specific bridge and fallback preserve existing generic membership'

      - name: Generate opt-in Quickslots D-pad cache from post-generic InputHub bridge
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll'
          & dotnet $dll phase2-quickslots-dpad --game '.phase2-private/base_after_generic' --base-overlay $env:PHASE2_QUICKSLOTS_OUTPUT --out $env:PHASE2_DPAD_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_CQ_DPAD_GENERATION_FAILED' }
          $result=Get-Content -LiteralPath (Join-Path $env:PHASE2_DPAD_OUTPUT 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($result.ruleId -ne 'CUSTOM_QUICKSLOTS_DPAD_STATE_CACHE_V1' -or
              $result.status -ne 'APPLIED' -or [int]$result.appliedEdits -ne 1) {
            throw ('PHASE2_CQ_DPAD_MUST_APPLY: '+$result.status+' '+$result.reason)
          }
          $relative='r6/scripts/custom_quickslots/player_puppet.reds'
          $generated=Join-Path $env:PHASE2_DPAD_OUTPUT $relative
          if (!(Test-Path -LiteralPath $generated -PathType Leaf)) {
            throw 'PHASE2_CQ_DPAD_OUTPUT_MISSING'
          }
          $text=Get-Content -LiteralPath $generated -Raw
          if (!$text.Contains('!this.player.PlayerLastUsedPad()') -or
              !$text.Contains('this.RecomputeDpadProhibitions();') -or
              !$text.Contains('GRSP-GENERIC:CNAME_ARRAY_MEMBERSHIP_V1') -or
              !$text.Contains('this.customQuickslotsInputHub.Subscribe(') -or
              !$text.Contains('this.customQuickslotsFallbackRegistered = true;')) {
            throw 'PHASE2_CQ_DPAD_GENERIC_OR_INPUT_FALLBACK_LOST'
          }
          Copy-Item -LiteralPath $generated -Destination (Join-Path $env:PHASE2_OUTPUT $relative) -Force
          Write-Host 'PASS Quickslots D-pad cache opt-in: cached getters, KBM mode off, generic and InputHub preserved'

      - name: Generate historical Quickhack direct-tag predicate and preserve original wrappers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll'
          & dotnet $dll phase2-quickhack-tags --game '.phase2-private/base_after_generic' --base-overlay $env:PHASE2_OUTPUT --out $env:PHASE2_QUICKHACK_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_QHF_GENERATION_FAILED' }
          $report=Get-Content -LiteralPath (Join-Path $env:PHASE2_QUICKHACK_OUTPUT 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($report.ruleId -ne 'QUICKHACK_FIXES_DIRECT_TAG_PREDICATE_V1' -or
              $report.status -ne 'APPLIED' -or [int]$report.appliedEdits -ne 2) {
            throw ('PHASE2_QHF_STOCK_EXPECTED_TWO_CALLBACKS: '+$report.status+' '+$report.reason)
          }
          $files=@(Get-ChildItem -LiteralPath (Join-Path $env:PHASE2_QUICKHACK_OUTPUT 'r6/scripts') -Recurse -File -Filter '*.reds')
          if ($files.Count -ne 1) { throw 'PHASE2_QHF_EXPECTED_SINGLE_OWNER_FILE' }
          foreach ($file in $files) {
            $relative=[IO.Path]::GetRelativePath((Join-Path $env:PHASE2_QUICKHACK_OUTPUT 'r6/scripts'),$file.FullName)
            $ownerRelative=$relative.Replace([IO.Path]::DirectorySeparatorChar, '/')
            if ($ownerRelative.StartsWith('..') -or !$ownerRelative.StartsWith('Quickhack_Fixes/')) {
              throw 'PHASE2_QHF_OWNER_PATH_UNSAFE'
            }
            $body=Get-Content -LiteralPath $file.FullName -Raw
            if ($body.Contains('GetAppliedEffectsWithTag(') -or
                $body.Contains('ArraySize(sonic_shock_ignore_effects)') -or
                @([regex]::Matches($body,'StatusEffectSystem.ObjectHasStatusEffectWithTag\(')).Count -ne 2 -or
                @([regex]::Matches($body,'wrappedMethod\(')).Count -ne 2) {
              throw 'PHASE2_QHF_HISTORICAL_PREDICATE_OR_FALLBACK_MISMATCH'
            }
            $dst=Join-Path (Join-Path $env:PHASE2_OUTPUT 'r6/scripts') $relative
            if (Test-Path -LiteralPath $dst) { throw 'PHASE2_QHF_UNEXPECTED_OWNER_COLLISION' }
            New-Item -ItemType Directory -Force -Path (Split-Path $dst -Parent) | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $dst
          }
          Write-Host 'PASS Quickhack direct tag predicate: two callbacks source-generated; fallback retained'

      - name: Generate RedWindows retained widget Find from historical Pass 9
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll'
          & dotnet $dll phase2-redwindows-find --game '.phase2-private/base_after_generic' --base-overlay $env:PHASE2_OUTPUT --out $env:PHASE2_REDWINDOWS_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_RW_FIND_GENERATION_FAILED' }
          $result=Get-Content -LiteralPath (Join-Path $env:PHASE2_REDWINDOWS_OUTPUT 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($result.ruleId -ne 'REDWINDOWS_RETAINED_WIDGET_LOOKUP_V1' -or
              $result.status -ne 'APPLIED' -or [int]$result.appliedEdits -ne 1) {
            throw ('PHASE2_RW_FIND_EXPECTED_APPLIED: '+$result.status+' '+$result.reason)
          }
          $files=@(Get-ChildItem -LiteralPath (Join-Path $env:PHASE2_REDWINDOWS_OUTPUT 'r6/scripts') -Recurse -File -Filter '*.reds')
          if ($files.Count -ne 1) { throw 'PHASE2_RW_FIND_ONE_OWNER_FILE_EXPECTED' }
          foreach($file in $files) {
            $relative=[IO.Path]::GetRelativePath((Join-Path $env:PHASE2_REDWINDOWS_OUTPUT 'r6/scripts'),$file.FullName)
            $safe=$relative.Replace([IO.Path]::DirectorySeparatorChar,'/')
            if (!$safe.StartsWith('RedWindows/') -or $safe.StartsWith('..')) {
              throw 'PHASE2_RW_FIND_PATH_UNSAFE'
            }
            $body=Get-Content -LiteralPath $file.FullName -Raw
            if (!$body.Contains('m_lastFindWidget') -or
                !$body.Contains('m_lastFindId') -or
                !$body.Contains('this.m_findCursor = idx + 1;') -or
                !$body.Contains('ArrayPush(this.m_widgets, widget);')) {
              throw 'PHASE2_RW_FIND_HISTORICAL_PREDICATE_INCOMPLETE'
            }
            $dst=Join-Path (Join-Path $env:PHASE2_OUTPUT 'r6/scripts') $relative
            if (Test-Path -LiteralPath $dst) {
              $previous=Get-Content -LiteralPath $dst -Raw
              foreach($marker in @([regex]::Matches($previous,
                  '(?:GCO|GRSP)-GENERIC:[A-Z0-9_]+') |
                  ForEach-Object Value | Sort-Object -Unique)) {
                if (!$body.Contains($marker,[StringComparison]::Ordinal)) {
                  throw 'PHASE2_RW_FIND_LOST_GENERIC'
                }
              }
            } else {
              New-Item -ItemType Directory -Force -Path (Split-Path $dst -Parent) | Out-Null
            }
            Copy-Item -LiteralPath $file.FullName -Destination $dst -Force
          }
          Write-Host 'PASS RedWindows retained Find: last-hit and predicted cursor; original owner preserved'

      - name: Generate TriggerModeControl literal CName tags from post-generic source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll'
          & dotnet $dll phase2-trigger-mode-tags --game '.phase2-private/base_after_generic' --base-overlay $env:PHASE2_OUTPUT --out $env:PHASE2_TRIGGER_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_TMC_TAG_GENERATION_FAILED' }
          $report=Get-Content -LiteralPath (Join-Path $env:PHASE2_TRIGGER_OUTPUT 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($report.ruleId -ne 'TRIGGER_MODE_LITERAL_TAG_NAMES_V1' -or
              $report.status -ne 'APPLIED' -or [int]$report.appliedEdits -ne 1) {
            throw ('PHASE2_TMC_TAG_SOURCE_NOT_APPLIED: '+$report.status+' '+$report.reason)
          }
          $relative='r6/scripts/TriggerModeControl/TriggerModeControl.reds'
          $source=Join-Path $env:PHASE2_TRIGGER_OUTPUT $relative
          if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
            throw 'PHASE2_TMC_TAG_OUTPUT_MISSING'
          }
          $text=Get-Content -LiteralPath $source -Raw
          foreach ($tag in @('ForceAuto','RemoveAuto','InstantCharge')) {
            if (!$text.Contains('n"'+$tag+'Primary"') -or
                !$text.Contains('n"'+$tag+'Secondary"') -or
                $text.Contains('StringToName("'+$tag+'"')) {
              throw ('PHASE2_TMC_TAG_NOT_LITERAL: '+$tag)
            }
          }
          if (!$text.Contains('PushForceRefreshInputHintsEventToPSM(') -or
              !$text.Contains('this.AddTriggerModeCtrlInputHints(')) {
            throw 'PHASE2_TMC_UNRELATED_INPUT_CADENCE_MUTATED'
          }
          $target=Join-Path $env:PHASE2_OUTPUT $relative
          if (Test-Path -LiteralPath $target) {
            $earlier=Get-Content -LiteralPath $target -Raw
            foreach($marker in @([regex]::Matches($earlier,
                '(?:GCO|GRSP)-GENERIC:[A-Z0-9_]+') |
                ForEach-Object Value | Sort-Object -Unique)) {
              if (!$text.Contains($marker,[StringComparison]::Ordinal)) {
                throw 'PHASE2_TMC_LOST_GENERIC'
              }
            }
          } else {
            New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
          }
          Copy-Item -LiteralPath $source -Destination $target -Force
          Write-Host 'PASS TriggerModeControl fixed CName tag checks; hint update cadence unchanged'

      - name: Generate DisablePositionReveal tracing-state guards
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll'
          & dotnet $dll phase2-disable-position-tracing --game '.phase2-private/base_after_generic' --base-overlay $env:PHASE2_OUTPUT --out $env:PHASE2_DPR_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_DPR_GENERATION_FAILED' }
          $report=Get-Content -LiteralPath (Join-Path $env:PHASE2_DPR_OUTPUT 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($report.ruleId -ne 'DISABLE_POSITION_REVEAL_TRACING_GUARDS_V1' -or
              $report.status -ne 'APPLIED' -or [int]$report.appliedEdits -ne 3) {
            throw ('PHASE2_DPR_STOCK_THREE_GUARDS_REQUIRED: '+$report.status+' '+$report.reason)
          }
          $relative='r6/scripts/DisablePositionReveal/DisablePositionReveal.reds'
          $source=Join-Path $env:PHASE2_DPR_OUTPUT $relative
          if (!(Test-Path -LiteralPath $source)) { throw 'PHASE2_DPR_FILE_MISSING' }
          $text=Get-Content -LiteralPath $source -Raw
          if (!$text.Contains('GetIsTracing()') -or
              !$text.Contains('super.OnDamageReceived(evt);') -or
              !$text.Contains('super.OnDefeated(evt);') -or
              !$text.Contains('wrappedMethod(obj, newState);')) {
            throw 'PHASE2_DPR_LOST_ORIGINAL_CALLBACKS'
          }
          $target=Join-Path $env:PHASE2_OUTPUT $relative
          if (Test-Path -LiteralPath $target) {
            $old=Get-Content -LiteralPath $target -Raw
            foreach ($marker in @([regex]::Matches($old,
                '(?:GCO|GRSP)-GENERIC:[A-Z0-9_]+') |
                ForEach-Object Value | Sort-Object -Unique)) {
              if (!$text.Contains($marker,[StringComparison]::Ordinal)) {
                throw 'PHASE2_DPR_LOST_GENERIC'
              }
            }
          } else {
            New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
          }
          Copy-Item -LiteralPath $source -Destination $target -Force
          Write-Host 'PASS DisablePositionReveal three state guards, original callbacks intact'

      - name: Generate HQ HoloGirl historical material event fast path
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll'
          & dotnet $dll phase2-hologirl-material --game '.phase2-private/base_after_generic' --base-overlay $env:PHASE2_OUTPUT --out $env:PHASE2_HOLOGIRL_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_HQ_HOLOGIRL_GENERATION_FAILED' }
          $report=Get-Content -LiteralPath (Join-Path $env:PHASE2_HOLOGIRL_OUTPUT 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($report.ruleId -ne 'HQ_HOLOGIRL_MATERIAL_EVENT_FASTPATH_V1' -or
              $report.status -ne 'APPLIED' -or [int]$report.appliedEdits -ne 1) {
            throw ('PHASE2_HQ_HOLOGIRL_EXPECTED_APPLIED: '+$report.status+' '+$report.reason)
          }
          $rel='r6/scripts/HQ_HoloGirl/Engine/HoloGirl.reds'
          $file=Join-Path $env:PHASE2_HOLOGIRL_OUTPUT $rel
          if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
            throw 'PHASE2_HQ_HOLOGIRL_OUTPUT_MISSING'
          }
          $now=Get-Content -LiteralPath $file -Raw
          if (!$now.Contains('this.holoBaseRR = HQRes("holo_base.mi");') -or
              !$now.Contains('ResourceRef.GetPath(mtl.baseMaterial) != this.holoBaseRR') -or
              !$now.Contains('let color = this.ResolveColor(this.holo.txColor);') -or
              !$now.Contains('let emissive = this.GetEmissive();') -or
              !$now.Contains('BindCallbackTRL(this, n"UpdateHQHolo"') -or
              !$now.Contains('HoloGirl.Get().UpdateAll();')) {
            throw 'PHASE2_HQ_HOLOGIRL_CALLBACK_OR_HOIST_MISSING'
          }
          $target=Join-Path $env:PHASE2_OUTPUT $rel
          if (Test-Path -LiteralPath $target -PathType Leaf) {
            throw 'PHASE2_HQ_HOLOGIRL_UNEXPECTED_OWNER_COLLISION'
          }
          New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
          Copy-Item -LiteralPath $file -Destination $target
          Write-Host 'PASS HQ_HoloGirl cached material target and event-local color/emissive'

      - name: Verify GCO one-pass Quickslots Stage from the real post-generic baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll'
          $game='.phase2-private/base_after_generic'
          $work=Join-Path $env:RUNNER_TEMP ('gco-cq-stage-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          try {
            $plan=Join-Path $work 'plan.json'
            $analysis=Join-Path $work 'analysis.json'
            $stage=Join-Path $work 'stage'
            & dotnet $dll plan-redscript --game $game --out $plan
            if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $plan -PathType Leaf)) {
              throw 'PHASE2_CQ_POSTGENERIC_PLAN_FAILED'
            }
            $manifest=Get-Content -LiteralPath $plan -Raw | ConvertFrom-Json
            if ([int]$manifest.implementedRuleCount -ne 10 -or
                [string]::IsNullOrWhiteSpace($manifest.sourceStackSha256)) {
              throw 'PHASE2_CQ_POSTGENERIC_PLAN_INVALID'
            }
            @{
              schemaVersion='grsp.resolver.input.v1'
              generationAuthorized=$false
              capture=@{ collectionProvenance='GCO_INDEXED_COLLECTED_BYTES_VERIFIED' }
              source=@{ sourceStackSha256=$manifest.sourceStackSha256 }
            } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $analysis -Encoding utf8
            & dotnet $dll stage-redscript-plan --game $game --plan $plan --analysis $analysis --out $stage
            if ($LASTEXITCODE -ne 0) { throw 'PHASE2_CQ_POSTGENERIC_STAGE_FAILED' }
            $stageReport=Join-Path $stage 'stage-result.json'
            if (!(Test-Path -LiteralPath $stageReport -PathType Leaf)) {
              throw 'PHASE2_CQ_POSTGENERIC_STAGE_REPORT_MISSING'
            }
            $result=Get-Content -LiteralPath $stageReport -Raw | ConvertFrom-Json
            $cq=@($result.completed | Where-Object { $_.id -eq 'custom-quickslots-input' })
            $dpad=@($result.completed | Where-Object { $_.id -eq 'custom-quickslots-dpad' })
            if ($result.schemaVersion -ne 'gco.redscript.staged-plan.v1' -or
                $result.productionZipAuthorized -ne $false -or
                $cq.Count -ne 1 -or [int]$cq[0].order -ne 16 -or
                [int]$cq[0].rewrittenExpressions -ne 1 -or
                $dpad.Count -ne 1 -or [int]$dpad[0].order -ne 17 -or
                [int]$dpad[0].rewrittenExpressions -ne 1) {
              throw 'PHASE2_CQ_AUTOMATIC_INPUT_AND_DPAD_STAGES_MISSING'
            }
            $qh=@($result.completed | Where-Object { $_.id -eq 'quickhack-direct-tags' })
            $qhRef=Join-Path $env:PHASE2_QUICKHACK_OUTPUT 'r6/scripts/Quickhack_Fixes/sonic_shock.reds'
            $qhActual=Join-Path $stage 'effective-preview/r6/scripts/Quickhack_Fixes/sonic_shock.reds'
            if ($qh.Count -ne 1 -or [int]$qh[0].order -ne 18 -or
                [int]$qh[0].rewrittenExpressions -ne 2 -or
                !(Test-Path -LiteralPath $qhActual) -or
                (Get-FileHash -LiteralPath $qhActual -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $qhRef -Algorithm SHA256).Hash) {
              throw 'PHASE2_QHF_CANONICAL_SINGLE_GENERATE_DIFFERENT_FROM_INDEPENDENT'
            }
            $rw=@($result.completed | Where-Object { $_.id -eq 'redwindows-widget-lookup' })
            $rwRef=Join-Path $env:PHASE2_REDWINDOWS_OUTPUT 'r6/scripts/RedWindows/RW_Window.reds'
            $rwActual=Join-Path $stage 'effective-preview/r6/scripts/RedWindows/RW_Window.reds'
            if ($rw.Count -ne 1 -or [int]$rw[0].order -ne 19 -or
                [int]$rw[0].rewrittenExpressions -ne 1 -or
                !(Test-Path -LiteralPath $rwActual) -or
                (Get-FileHash -LiteralPath $rwActual -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $rwRef -Algorithm SHA256).Hash) {
              throw 'PHASE2_RW_FIND_CANONICAL_OUTPUT_DIFFERENT_FROM_INDEPENDENT'
            }
            $tmc=@($result.completed | Where-Object { $_.id -eq 'trigger-mode-literal-tags' })
            $tmcRel='r6/scripts/TriggerModeControl/TriggerModeControl.reds'
            $tmcRef=Join-Path $env:PHASE2_TRIGGER_OUTPUT $tmcRel
            $tmcActual=Join-Path (Join-Path $stage 'effective-preview') $tmcRel
            if ($tmc.Count -ne 1 -or [int]$tmc[0].order -ne 20 -or
                [int]$tmc[0].rewrittenExpressions -ne 1 -or
                !(Test-Path -LiteralPath $tmcActual) -or
                (Get-FileHash -LiteralPath $tmcActual -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $tmcRef -Algorithm SHA256).Hash) {
              throw 'PHASE2_TMC_CANONICAL_SOURCE_DIFFERS_FROM_INDEPENDENT'
            }
            $dpr=@($result.completed | Where-Object { $_.id -eq 'disable-position-tracing' })
            $dprRel='r6/scripts/DisablePositionReveal/DisablePositionReveal.reds'
            $dprRef=Join-Path $env:PHASE2_DPR_OUTPUT $dprRel
            $dprActual=Join-Path (Join-Path $stage 'effective-preview') $dprRel
            if ($dpr.Count -ne 1 -or [int]$dpr[0].order -ne 21 -or
                [int]$dpr[0].rewrittenExpressions -ne 3 -or
                !(Test-Path -LiteralPath $dprActual) -or
                (Get-FileHash -LiteralPath $dprActual -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $dprRef -Algorithm SHA256).Hash) {
              throw 'PHASE2_DPR_CANONICAL_SOURCE_DIFFERS_FROM_INDEPENDENT'
            }
            $hq=@($result.completed | Where-Object { $_.id -eq 'hologirl-material-event' })
            $hqRel='r6/scripts/HQ_HoloGirl/Engine/HoloGirl.reds'
            $hqRef=Join-Path $env:PHASE2_HOLOGIRL_OUTPUT $hqRel
            $hqActual=Join-Path (Join-Path $stage 'effective-preview') $hqRel
            if ($hq.Count -ne 1 -or [int]$hq[0].order -ne 22 -or
                [int]$hq[0].rewrittenExpressions -ne 1 -or
                !(Test-Path -LiteralPath $hqActual) -or
                (Get-FileHash -LiteralPath $hqActual -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $hqRef -Algorithm SHA256).Hash) {
              throw 'PHASE2_HQ_HOLOGIRL_CANONICAL_DIFFERS_FROM_REFERENCE'
            }
            $reference=Join-Path $env:PHASE2_DPAD_OUTPUT 'r6/scripts/custom_quickslots/player_puppet.reds'
            $output=Join-Path $stage 'effective-preview/r6/scripts/custom_quickslots/player_puppet.reds'
            if (!(Test-Path -LiteralPath $output -PathType Leaf) -or
                !(Test-Path -LiteralPath $reference -PathType Leaf)) {
              throw 'PHASE2_CQ_POSTGENERIC_SOURCE_MISSING'
            }
            if ((Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $reference -Algorithm SHA256).Hash) {
              throw 'PHASE2_CQ_POSTGENERIC_ORDERED_SOURCE_DIFF'
            }
            $contents=Get-Content -LiteralPath $output -Raw
            if (!$contents.Contains('GRSP-GENERIC:CNAME_ARRAY_MEMBERSHIP_V1') -or
                !$contents.Contains('this.customQuickslotsFallbackRegistered = true;') -or
                !$contents.Contains('this.customQuickslotsInputHub.UnsubscribeDevice(') -or
                !$contents.Contains('!this.player.PlayerLastUsedPad()') -or
                !$contents.Contains('this.RecomputeDpadProhibitions();')) {
              throw 'PHASE2_CQ_POSTGENERIC_GENERIC_OR_INPUT_STATE_LOST'
            }
            Write-Host 'PASS GCO real post-generic one-pass Stage: Quickslots InputHub #16 and D-pad #17 applied automatically; original PlayerLastUsedPad and generic preserved; independent bytes equal'

          }
          finally {
            if (Test-Path -LiteralPath $work) {
              Remove-Item -LiteralPath $work -Recurse -Force
            }
          }

      - name: Checkpoint - compile post-generic plus real semantic overlay
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./tests/GRedscript.Resolver.Tests/Verify-Phase2Checkpoint.ps1 -PostGenericRoot '.phase2-private/base_after_generic' -CompilerRoot '.phase2-private/Compiler' -ResolverDll 'src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll' -SemanticOverlayRoot $env:PHASE2_OUTPUT
          if (!$?) { throw 'PHASE2_CHECKPOINT_FAILED' }

      - name: Remove private source and compiler after validation
        if: always()
        shell: pwsh
        run: |
          foreach ($path in @('.phase2-private', $env:PHASE2_OUTPUT, $env:PHASE2_DARK_OUTPUT, $env:PHASE2_ICON_OUTPUT, $env:PHASE2_FE_OUTPUT, $env:PHASE2_FE_PINS_OUTPUT, $env:PHASE2_QUICKSLOTS_OUTPUT, $env:PHASE2_DPAD_OUTPUT, $env:PHASE2_QUICKHACK_OUTPUT, $env:PHASE2_REDWINDOWS_OUTPUT, $env:PHASE2_TRIGGER_OUTPUT, $env:PHASE2_DPR_OUTPUT, $env:PHASE2_HOLOGIRL_OUTPUT)) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Force -Recurse
            }
          }
