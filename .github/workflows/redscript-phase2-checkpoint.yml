name: REDscript Phase 2 - Post-generic checkpoint

# Chronological GCO generation checkpoints:
# 1. Generic source optimization (existing owner CI).
# 2. This focused Phase 2 checkpoint on already-generic source.
# Future semantic generator changes extend this same checkpoint.
# No CET capture replay, WPF packaging, second compiler or game writes.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ci/redscript-phase2-postgeneric
      - dev/redscript/resolver_handoff
    paths:
      - '.github/workflows/redscript-phase2-checkpoint.yml'
      - 'tests/GRedscript.Resolver.Tests/Verify-Phase2Checkpoint.ps1'
      - 'src/GRedscript.Resolver/**'
      - 'tests/GRedscript.Resolver.Tests/test_phase2_*.py'

permissions:
  contents: read

concurrency:
  group: redscript-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  post-generic:
    name: Phase 2 checkpoint - SCC
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PHASE2_OUTPUT: ${{ github.workspace }}/.phase2-generated
      PHASE2_DARK_OUTPUT: ${{ github.workspace }}/.phase2-darkfuture
      PHASE2_ICON_OUTPUT: ${{ github.workspace }}/.phase2-darkfuture-icons
      PHASE2_FE_OUTPUT: ${{ github.workspace }}/.phase2-fe-input
      PHASE2_FE_MAP_OUTPUT: ${{ github.workspace }}/.phase2-fe-map
    steps:
      - name: Checkout GCO REDscript resolver
        uses: actions/checkout@v4

      - name: Checkout already-generic private source and CI-only SCC inputs
        uses: actions/checkout@v4
        with:
          repository: giorgioherma/original_cet_source
          ref: main
          token: ${{ secrets.GCET_STACK_SOURCES_TOKEN }}
          persist-credentials: false
          path: .phase2-private
          sparse-checkout: |
            base_after_generic/r6/scripts
            Compiler
          sparse-checkout-cone-mode: true

      - name: Configure .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure Python for semantic source-state contracts
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the existing SCC owner CLI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build src/GRedscript.Resolver/GRSP.Resolver.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_RESOLVER_BUILD_FAILED' }

      - name: Validate DigitalVixenCore Footsteps semantic source states
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m unittest discover -s tests/GRedscript.Resolver.Tests -p 'test_phase2_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_SEMANTIC_SOURCE_STATE_TEST_FAILED' }

      - name: Generate Footsteps semantic overlay from post-generic stock
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & dotnet src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll phase2-footsteps --game '.phase2-private/base_after_generic' --out $env:PHASE2_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_SEMANTIC_GENERATOR_FAILED' }
          $report=Get-Content -LiteralPath (Join-Path $env:PHASE2_OUTPUT 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($report.ruleId -ne 'DVCORE_FOOTSTEPS_REFLECTION_SUCCESS_CACHE_V1' -or
              $report.status -ne 'APPLIED' -or $report.appliedEdits -ne 1) {
            throw ('PHASE2_SEMANTIC_STOCK_OUTPUT_MISSING: '+$report.status)
          }

      - name: Generate Dark Future safe tag cache after Footsteps
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & dotnet src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll phase2-dark-future --game '.phase2-private/base_after_generic' --base-overlay $env:PHASE2_OUTPUT --out $env:PHASE2_DARK_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_DARK_FUTURE_GENERATOR_FAILED' }
          $report=Get-Content -LiteralPath (Join-Path $env:PHASE2_DARK_OUTPUT 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($report.ruleId -ne 'DARK_FUTURE_INFINITE_TAG_CACHE_V1' -or
              $report.status -ne 'APPLIED' -or [int]$report.appliedEdits -ne 1) {
            throw ('PHASE2_DARK_FUTURE_STOCK_OUTPUT_MISSING: '+$report.status+' '+$report.reason)
          }
          $src=Join-Path $env:PHASE2_DARK_OUTPUT 'r6/scripts'
          $dst=Join-Path $env:PHASE2_OUTPUT 'r6/scripts'
          $files=@(Get-ChildItem -LiteralPath $src -Recurse -File -Filter '*.reds')
          if ($files.Count -ne 1) { throw 'PHASE2_DARK_FUTURE_EXPECTED_ONE_SOURCE' }
          foreach ($file in $files) {
            $rel=[IO.Path]::GetRelativePath($src, $file.FullName)
            if ([IO.Path]::IsPathRooted($rel) -or $rel.StartsWith('..')) {
              throw 'PHASE2_DARK_FUTURE_SOURCE_PATH_UNSAFE'
            }
            $target=Join-Path $dst $rel
            if (Test-Path -LiteralPath $target) {
              throw 'PHASE2_DARK_FUTURE_OWNER_FILE_COLLISION'
            }
            New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $target
          }
          Write-Host 'PASS Phase 2 combined semantic overlay: DVCore=1 DarkFuture=1'

      - name: Generate 400ms Dark Future status icon cadence after tag cache
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll'
          & dotnet $dll phase2-dark-future-icons --game '.phase2-private/base_after_generic' --base-overlay $env:PHASE2_OUTPUT --out $env:PHASE2_ICON_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_DF_ICON_GENERATOR_FAILED' }
          $report=Get-Content -LiteralPath (Join-Path $env:PHASE2_ICON_OUTPUT 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($report.ruleId -ne 'DARK_FUTURE_STATUS_ICON_400MS_V1' -or
              $report.status -ne 'APPLIED' -or [int]$report.appliedEdits -ne 1) {
            throw ('PHASE2_DF_ICON_NOT_APPLIED: '+$report.status+' '+$report.reason)
          }
          $source=Join-Path $env:PHASE2_ICON_OUTPUT 'r6/scripts'
          $dest=Join-Path $env:PHASE2_OUTPUT 'r6/scripts'
          $files=@(Get-ChildItem -LiteralPath $source -Recurse -File -Filter '*.reds')
          if ($files.Count -ne 1) { throw 'PHASE2_DF_ICON_EXPECTED_ONE_SOURCE' }
          foreach ($file in $files) {
            $relative=[IO.Path]::GetRelativePath($source,$file.FullName)
            if ([IO.Path]::IsPathRooted($relative) -or $relative.StartsWith('..')) {
              throw 'PHASE2_DF_ICON_PATH_ESCAPE'
            }
            $target=Join-Path $dest $relative
            if (!(Test-Path -LiteralPath $target -PathType Leaf)) {
              throw 'PHASE2_DF_ICON_DID_NOT_COMPOSE_AFTER_TAG_CACHE'
            }
            $old=Get-Content -LiteralPath $target -Raw
            $new=Get-Content -LiteralPath $file.FullName -Raw
            if (!$old.Contains('m_gcoDfInfiniteTagValid') -or
                !$new.Contains('m_gcoDfInfiniteTagValid') -or
                !$new.Contains('DarkFutureCanHideOnBuffBar') -or
                !$new.Contains('now + 0.40')) {
              throw 'PHASE2_DF_ICON_CROSS_SEMANTIC_PROOF_FAILED'
            }
            foreach ($m in @([regex]::Matches($old,
              '(?:GCO|GRSP)-GENERIC:[A-Z0-9_]+') | ForEach-Object Value |
                Sort-Object -Unique)) {
              if (!$new.Contains($m,[StringComparison]::Ordinal)) {
                throw 'PHASE2_DF_ICON_DROPPED_GENERIC_SOURCE'
              }
            }
            Copy-Item -LiteralPath $file.FullName -Destination $target -Force
          }
          Write-Host 'PASS three semantic operations compose in two owner source files'

      - name: Generate FE early-input guard after generic and existing semantics
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll'
          & dotnet $dll phase2-fe-input --game '.phase2-private/base_after_generic' --base-overlay $env:PHASE2_OUTPUT --out $env:PHASE2_FE_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_FE_GENERATOR_FAILED' }
          $report=Get-Content -LiteralPath (Join-Path $env:PHASE2_FE_OUTPUT 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($report.ruleId -ne 'FLUSHING_ETIQUETTE_UNRELATED_INPUT_GATE_V1' -or
              $report.status -ne 'APPLIED' -or [int]$report.appliedEdits -ne 1) {
            throw ('PHASE2_FE_INPUT_EXPECTED_APPLIED: '+$report.status+' '+$report.reason)
          }
          $source=Join-Path $env:PHASE2_FE_OUTPUT 'r6/scripts'
          $dest=Join-Path $env:PHASE2_OUTPUT 'r6/scripts'
          $files=@(Get-ChildItem -LiteralPath $source -File -Recurse -Filter '*.reds')
          if ($files.Count -ne 1) { throw 'PHASE2_FE_EXPECTED_ONE_SOURCE' }
          foreach ($file in $files) {
            $rel=[IO.Path]::GetRelativePath($source,$file.FullName)
            if ([IO.Path]::IsPathRooted($rel) -or $rel.StartsWith('..')) {
              throw 'PHASE2_FE_SOURCE_PATH_UNSAFE'
            }
            $target=Join-Path $dest $rel
            if (Test-Path -LiteralPath $target -PathType Leaf) {
              throw 'PHASE2_FE_DID_NOT_EXPECT_OWNER_COLLISION'
            }
            $now=Get-Content -LiteralPath $file.FullName -Raw
            if (!$now.Contains('GCO-GENERIC:CNAME_FIXED_INDEX_V1') -or
                !$now.Contains('return wrappedMethod(action, consumer);') -or
                !$now.Contains('ListenerAction.GetType(action)')) {
              throw 'PHASE2_FE_LOST_GENERIC_OR_ONACTION_FALLBACK'
            }
            New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $target
          }
          Write-Host 'PASS four approved semantic operations compose after generic source'

      - name: Generate FE minimap global-update dormancy after FE input
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll'
          & dotnet $dll phase2-fe-minimap --game '.phase2-private/base_after_generic' --base-overlay $env:PHASE2_OUTPUT --out $env:PHASE2_FE_MAP_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PHASE2_FE_MINIMAP_GENERATOR_FAILED' }
          $report=Get-Content -LiteralPath (Join-Path $env:PHASE2_FE_MAP_OUTPUT 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($report.ruleId -ne 'FLUSHING_ETIQUETTE_MINIMAP_UPDATE_DORMANCY_V1' -or
              $report.status -ne 'APPLIED' -or [int]$report.appliedEdits -ne 1) {
            throw ('PHASE2_FE_MINIMAP_EXPECTED_APPLIED: '+$report.status+' '+$report.reason)
          }
          $source=Join-Path $env:PHASE2_FE_MAP_OUTPUT 'r6/scripts'
          $dest=Join-Path $env:PHASE2_OUTPUT 'r6/scripts'
          $files=@(Get-ChildItem -LiteralPath $source -File -Recurse -Filter '*.reds')
          if ($files.Count -ne 1) { throw 'PHASE2_FE_MINIMAP_EXPECTED_ONE_SOURCE' }
          foreach ($file in $files) {
            $rel=[IO.Path]::GetRelativePath($source,$file.FullName)
            if ([IO.Path]::IsPathRooted($rel) -or $rel.StartsWith('..')) {
              throw 'PHASE2_FE_MINIMAP_PATH_UNSAFE'
            }
            $target=Join-Path $dest $rel
            if (Test-Path -LiteralPath $target -PathType Leaf) {
              throw 'PHASE2_FE_MINIMAP_UNEXPECTED_FILE_COLLISION'
            }
            $now=Get-Content -LiteralPath $file.FullName -Raw
            if ($now.Contains('@wrapMethod(BaseMinimapMappinController)') -or
                !$now.Contains('@wrapMethod(MinimapPOIMappinController)') -or
                !$now.Contains('this.FEApplyWashroomIcon();') -or
                !$now.Contains('return mappin.GetScriptData() as FEWashroomPinData;')) {
              throw 'PHASE2_FE_MINIMAP_TARGETED_HOOK_OR_DATA_LOST'
            }
            New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $target
          }
          Write-Host 'PASS FE minimap per-update wrapper removed; targeted icon callback retained'

      - name: Checkpoint - compile post-generic plus real semantic overlay
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./tests/GRedscript.Resolver.Tests/Verify-Phase2Checkpoint.ps1 -PostGenericRoot '.phase2-private/base_after_generic' -CompilerRoot '.phase2-private/Compiler' -ResolverDll 'src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll' -SemanticOverlayRoot $env:PHASE2_OUTPUT
          if (!$?) { throw 'PHASE2_CHECKPOINT_FAILED' }

      - name: Remove private source and compiler after validation
        if: always()
        shell: pwsh
        run: |
          foreach ($path in @('.phase2-private', $env:PHASE2_OUTPUT, $env:PHASE2_DARK_OUTPUT, $env:PHASE2_ICON_OUTPUT, $env:PHASE2_FE_OUTPUT, $env:PHASE2_FE_MAP_OUTPUT)) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Force -Recurse
            }
          }
