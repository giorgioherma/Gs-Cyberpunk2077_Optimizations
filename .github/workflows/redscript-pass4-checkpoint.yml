name: REDscript Pass 4 - isolated combat checkpoint

# Independent source-state and official SCC contract for the Pass 4
# development branch. Does not modify or cancel shared Phase 2 jobs.
on:
  workflow_dispatch:
  push:
    branches:
      - dev/redscript/pass4
    paths:
      - '.github/workflows/redscript-pass4-checkpoint.yml'
      - 'src/GRedscript.Pass4/**'
      - 'tests/GRedscript.Resolver.Tests/test_pass4_*.py'

permissions:
  contents: read

concurrency:
  group: redscript-pass4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combat:
    name: Pass 4 source state and official SCC 0.5.31
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated Pass 4 branch
        uses: actions/checkout@v4

      - name: Checkout authoritative post-generic stack and CI-only SCC
        uses: actions/checkout@v4
        with:
          repository: giorgioherma/original_cet_source
          ref: main
          token: ${{ secrets.GCET_STACK_SOURCES_TOKEN }}
          persist-credentials: false
          path: .pass4-private
          sparse-checkout: |
            base_after_generic/r6/scripts
            Compiler
          sparse-checkout-cone-mode: true

      - name: Configure .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build isolated Pass 4 generator and authoritative SCC runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build src/GRedscript.Pass4/GRedscript.Pass4.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'PASS4_GENERATOR_DOTNET_BUILD_FAILED' }
          dotnet build src/GRedscript.Resolver/GRSP.Resolver.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'PASS4_SCC_OWNER_BUILD_FAILED' }

      - name: Verify original, partial, complete, custom, incompatible and absent states
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m unittest discover -s tests/GRedscript.Resolver.Tests -p 'test_pass4_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'PASS4_SOURCE_STATE_CONTRACT_FAILED' }

      - name: Generate all applicable Pass 4 operations in one source-aware invocation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/GRedscript.Pass4/bin/Release/net10.0/GRedscript.Pass4.dll'
          & dotnet $dll pass4 --game '.pass4-private/base_after_generic' --out '.pass4-generated'
          if ($LASTEXITCODE -ne 0) { throw 'PASS4_ONE_RUN_GENERATOR_FAILED' }
          $report=Get-Content '.pass4-generated/pass4-result.json' -Raw | ConvertFrom-Json
          if ($report.schemaVersion -ne 'gco.phase2.pass4.isolated.v1' -or
              $report.sourceUnchanged -ne $true -or
              $report.status -ne 'APPLIED') {
            throw ('PASS4_GENERATION_NOT_APPLIED: '+$report.status)
          }
          foreach($id in @(
            'STEALTHRUNNER_NPC_PLAYER_CACHE_V1',
            'CHIPWARE_PERK_RELEVANCE_GATE_V1',
            'REINFORCEMENTS_PREPARED_QUAD_CACHE_V1')) {
            $item=@($report.operations | Where-Object ruleId -eq $id)
            if($item.Count -ne 1 -or $item[0].status -ne 'APPLIED') {
              throw ('PASS4_OWNER_MISSING: '+$id+' '+(@($item | ForEach-Object reason) -join ';'))
            }
          }
          $files=@(Get-ChildItem '.pass4-generated/r6/scripts' -Recurse -File -Filter '*.reds')
          if($files.Count -ne 4 -or @($report.sourcePaths).Count -ne 4) {
            throw ('PASS4_EXPECTED_FOUR_GAME_RELATIVE_SOURCES: '+$files.Count)
          }
          $utils=@(Get-ChildItem '.pass4-generated/r6/scripts/ReinforcementsSystem' -Recurse -File -Filter 'Utils.reds')
          if($utils.Count -ne 1) { throw 'PASS4_REINFORCEMENTS_UTILS_NOT_UNIQUE' }
          $text=Get-Content $utils[0].FullName -Raw
          foreach($marker in @('GCO-GENERIC:ANGLE_SORT_INVARIANT_V1',
                'GCO-GENERIC:QUAD_SAFE_AABB_BROADPHASE_V1',
                'return IsPointInQuad(p, sq);')) {
            if(!$text.Contains($marker,[StringComparison]::Ordinal)) {
              throw ('PASS4_GENERIC_OR_MUTATION_FALLBACK_MISSING: '+$marker)
            }
          }
          & dotnet $dll pass4 --game '.pass4-private/base_after_generic' --base-overlay '.pass4-generated' --out '.pass4-repeated'
          if ($LASTEXITCODE -ne 0) { throw 'PASS4_REPEATED_GENERATION_FAILED' }
          $second=Get-Content '.pass4-repeated/pass4-result.json' -Raw | ConvertFrom-Json
          if($second.status -ne 'COMPLETE' -or
             [int]$second.appliedEdits -ne 0 -or
             @(Get-ChildItem '.pass4-repeated/r6/scripts' -File -Recurse -ErrorAction SilentlyContinue).Count -ne 0) {
            throw 'PASS4_REPEATED_GENERATION_NOT_IDEMPOTENT'
          }
          Write-Host ('PASS Pass4 one-run owners=3 files='+$files.Count+' repeated=no-op')

      - name: Compile real post-generic stack with all Pass 4 source files using official SCC 0.5.31
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./tests/GRedscript.Resolver.Tests/Verify-Phase2Checkpoint.ps1 -PostGenericRoot '.pass4-private/base_after_generic' -CompilerRoot '.pass4-private/Compiler' -ResolverDll 'src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll' -SemanticOverlayRoot '.pass4-generated'
          if ($LASTEXITCODE -ne 0) { throw 'PASS4_OFFICIAL_SCC_FAILED' }

      - name: Verify canonical GCO one-generation stage includes all Pass 4 operations
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $game='.pass4-private/base_after_generic'
          $dll='src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll'
          $plan='.pass4-plan.json'
          $analysis='.pass4-analysis.json'
          $stage='.pass4-canonical-stage'
          & dotnet $dll plan-redscript --game $game --out $plan
          if($LASTEXITCODE -ne 0 -or !(Test-Path $plan -PathType Leaf)) {
            throw 'PASS4_CANONICAL_PLAN_FAILED'
          }
          $manifest=Get-Content -LiteralPath $plan -Raw | ConvertFrom-Json
          if([int]$manifest.implementedRuleCount -ne 10 -or
             [string]::IsNullOrWhiteSpace($manifest.sourceStackSha256)) {
            throw 'PASS4_CANONICAL_GENERIC_PLAN_CHANGED'
          }
          @{
            schemaVersion='grsp.resolver.input.v1'
            generationAuthorized=$false
            capture=@{collectionProvenance='GCO_INDEXED_COLLECTED_BYTES_VERIFIED'}
            source=@{sourceStackSha256=$manifest.sourceStackSha256}
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $analysis -Encoding utf8
          & dotnet $dll stage-redscript-plan --game $game --plan $plan --analysis $analysis --out $stage
          if($LASTEXITCODE -ne 0) { throw 'PASS4_CANONICAL_ONE_RUN_FAILED' }
          $report=Get-Content -LiteralPath (Join-Path $stage 'stage-result.json') -Raw | ConvertFrom-Json
          if($report.schemaVersion -ne 'gco.redscript.staged-plan.v1' -or
             $report.productionZipAuthorized -ne $false) {
            throw 'PASS4_CANONICAL_REPORT_INVALID'
          }
          $expect=@(
            @{order=37;id='stealthrunner-npc-player-cache';file='r6/scripts/StealthRunner/npc_puppet.reds'},
            @{order=38;id='chipware-perk-relevance-gate';file='r6/scripts/zzy_bChipwareExpansion/chipsScripts/chipPerkUnlock.reds'},
            @{order=39;id='reinforcements-prepared-quad-cache';file='r6/scripts/ReinforcementsSystem/Utils.reds'},
            @{order=39;id='reinforcements-prepared-quad-cache';file='r6/scripts/ReinforcementsSystem/ReinforcementSystem.reds'}
          )
          foreach($item in $expect) {
            $row=@($report.completed | Where-Object { $_.order -eq $item.order -and $_.id -eq $item.id })
            if($row.Count -lt 1) { throw ('PASS4_CANONICAL_STAGE_MISSING:'+ $item.id) }
            $actual=Join-Path (Join-Path $stage 'effective-preview') $item.file
            $isolated=Join-Path '.pass4-generated' $item.file
            if(!(Test-Path -LiteralPath $actual -PathType Leaf) -or
               !(Test-Path -LiteralPath $isolated -PathType Leaf) -or
               (Get-FileHash -LiteralPath $actual -Algorithm SHA256).Hash -ne
               (Get-FileHash -LiteralPath $isolated -Algorithm SHA256).Hash) {
              throw ('PASS4_CANONICAL_COMPOSITION_BYTES_DIFFER:'+ $item.file)
            }
          }
          if(@($report.completed | Where-Object {
             $_.order -in @(37,38,39) }).Count -ne 4 -or
             @($report.skipped | Where-Object { $_.order -in @(37,38,39) }).Count -ne 0) {
            throw 'PASS4_CANONICAL_OWNER_COUNT_OR_REFUSAL_INVALID'
          }
          Write-Host 'PASS canonical one-run 10 generics + all existing semantics + 3 Pass 4 owners; independent bytes equal'

      - name: Compile full canonical GCO one-run semantic output using official SCC 0.5.31
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./tests/GRedscript.Resolver.Tests/Verify-Phase2Checkpoint.ps1 -PostGenericRoot '.pass4-private/base_after_generic' -CompilerRoot '.pass4-private/Compiler' -ResolverDll 'src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll' -SemanticOverlayRoot '.pass4-canonical-stage/effective-preview'
          if($LASTEXITCODE -ne 0) { throw 'PASS4_CANONICAL_FULL_SEMANTIC_SCC_FAILED' }

      - name: Verify production .NET 10 Core/App compilation and tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # Build validation is framework-dependent; the existing owner
          # packaging pipeline performs the self-contained publish separately.
          # Do not change the app's product/runtime packaging properties.
          dotnet build src/GTotalOptimizer.App/GTotalOptimizer.App.csproj -c Release -p:SelfContained=false --nologo
          if($LASTEXITCODE -ne 0) { throw 'PASS4_PRODUCTION_APP_BUILD_FAILED' }
          dotnet run --project tests/GTotalOptimizer.Core.Tests/GTotalOptimizer.Core.Tests.csproj -c Release --no-restore
          if($LASTEXITCODE -ne 0) { throw 'PASS4_PRODUCTION_CORE_TESTS_FAILED' }

      - name: Remove private stack, compiler and generated source
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force '.pass4-private','.pass4-generated','.pass4-repeated','.pass4-canonical-stage','.pass4-plan.json','.pass4-analysis.json' -ErrorAction SilentlyContinue
