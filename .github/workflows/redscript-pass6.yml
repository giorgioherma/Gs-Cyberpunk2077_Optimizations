name: REDscript Pass 6 - Isolated frame-pacing SCC

on:
  workflow_dispatch:
  push:
    branches:
      - dev/redscript/pass6
    paths:
      - '.github/workflows/redscript-pass6.yml'
      - 'src/GRedscript.Resolver/Phase2/VirtualAtelierSpawnPacingPass.cs'
      - 'src/GRedscript.Resolver/Phase2/EnhancedVehicleCameraRegistrationPass.cs'
      - 'src/GRedscript.Resolver/RedscriptGenerationPlan.cs'
      - 'src/GRedscript.Resolver/Program.cs'
      - 'tests/GRedscript.Resolver.Tests/test_phase2_vad_spawn_pacing.py'
      - 'tests/GRedscript.Resolver.Tests/test_phase2_evs_camera.py'

permissions:
  contents: read

concurrency:
  group: redscript-pass6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pass6-postgeneric:
    name: Pass 6 - source states, combined SCC 0.5.31
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated candidate
        uses: actions/checkout@v4

      - name: Checkout post-generic source and CI-only compiler
        uses: actions/checkout@v4
        with:
          repository: giorgioherma/original_cet_source
          ref: main
          token: ${{ secrets.GCET_STACK_SOURCES_TOKEN }}
          persist-credentials: false
          path: .pass6-private
          sparse-checkout: |
            base_after_generic/r6/scripts
            Compiler
          sparse-checkout-cone-mode: true

      - name: Configure .NET 10 and Python
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure source-state test Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build GCO resolver and run source-state contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build src/GRedscript.Resolver/GRSP.Resolver.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'PASS6_RESOLVER_BUILD_FAILED' }
          python -m unittest discover -s tests/GRedscript.Resolver.Tests -p 'test_phase2_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'PASS6_SOURCE_STATES_FAILED' }

      - name: Compose prior one-pass semantics plus Pass 6 and compile SCC
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll'
          $game='.pass6-private/base_after_generic'
          $plan='.pass6-plan.json'
          $analysis='.pass6-analysis.json'
          $stage='.pass6-existing-stage'
          $vad='.pass6-vad'
          & dotnet $dll plan-redscript --game $game --out $plan
          if ($LASTEXITCODE -ne 0) { throw 'PASS6_GENERIC_FIRST_PLAN_FAILED' }
          $manifest=Get-Content -LiteralPath $plan -Raw | ConvertFrom-Json
          if ([int]$manifest.implementedRuleCount -ne 10 -or
              [string]::IsNullOrWhiteSpace($manifest.sourceStackSha256)) {
            throw 'PASS6_NOT_POST_GENERIC_SOURCE'
          }
          @{
            schemaVersion='grsp.resolver.input.v1'
            generationAuthorized=$false
            capture=@{ collectionProvenance='GCO_INDEXED_COLLECTED_BYTES_VERIFIED' }
            source=@{ sourceStackSha256=$manifest.sourceStackSha256 }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $analysis -Encoding utf8
          & dotnet $dll stage-redscript-plan --game $game --plan $plan --analysis $analysis --out $stage
          if ($LASTEXITCODE -ne 0) { throw 'PASS6_EXISTING_ONE_PASS_STAGE_FAILED' }
          $staged=Join-Path $stage 'effective-preview'
          if (!(Test-Path (Join-Path $staged 'r6/scripts/GearRecoverySystem/25_GRSInteractionController.reds'))) {
            throw 'PASS6_PRIOR_SEMANTICS_MISSING'
          }
          # Production Stage owns the rewrite. Generate a standalone
          # reference solely for byte-identical comparison, never for copying.
          $stageReport=Get-Content -LiteralPath (Join-Path $stage 'stage-result.json') -Raw | ConvertFrom-Json
          $vadStage=@($stageReport.completed | Where-Object { $_.id -eq 'virtual-atelier-spawn-pacing' })
          if ($vadStage.Count -ne 1 -or [int]$vadStage[0].order -ne 37 -or
              [int]$vadStage[0].rewrittenExpressions -lt 1) {
            throw 'PASS6_VAD_MISSING_FROM_PRODUCTION_ONE_PASS_STAGE'
          }
          & dotnet $dll phase2-vad-spawn --game $game --out $vad
          if ($LASTEXITCODE -ne 0) { throw 'PASS6_INDEPENDENT_VAD_GENERATOR_FAILED' }
          $report=Get-Content -LiteralPath (Join-Path $vad 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($report.ruleId -ne 'VIRTUAL_ATELIER_DROPPOINT_SPAWN_PACING_V1' -or
              $report.status -ne 'APPLIED' -or
              [int]$report.appliedEdits -ne [int]$vadStage[0].rewrittenExpressions) {
            throw ('PASS6_REFERENCE_MISMATCH: '+$report.status+' '+$report.reason)
          }
          $rel=[string]$report.sourcePath
          if (!$rel.StartsWith('r6/scripts/',[StringComparison]::Ordinal) -or
              !$rel.EndsWith('.reds',[StringComparison]::OrdinalIgnoreCase)) {
            throw ('PASS6_VAD_WRONG_OWNER_PATH: '+$rel)
          }
          $src=Join-Path $vad $rel
          $dst=Join-Path $staged $rel
          if (!(Test-Path -LiteralPath $src -PathType Leaf) -or
              !(Test-Path -LiteralPath $dst -PathType Leaf) -or
              (Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash) {
            throw 'PASS6_PRODUCTION_ONE_PASS_OUTPUT_NOT_BYTE_IDENTICAL'
          }
          $compiledSource=Get-Content -LiteralPath $dst -Raw
          foreach($required in @(
            'GcoAtelierSpawnBatchCallback extends DelayCallback',
            'DelayCallback(cb, 0.05, false)',
            'this.delaySystem.CancelCallback(this.m_gcoVadSpawnCallback)',
            'this.SpawnDropPointEntity(vadImmediate)',
            'this.entitySystem.DeleteTagged(tag)')) {
            if (!$compiledSource.Contains($required,[StringComparison]::Ordinal)) {
              throw ('PASS6_GENERATED_BEHAVIOR_MISSING: '+$required)
            }
          }
          Write-Host ('PASS production one-pass VAD #37; edits='+$report.appliedEdits)
          # The same one-pass Stage also applies the independent EVS
          # camera subscriptions change to the owner file already
          # transformed by #30. Generate an independent #30->#38 reference.
          $evsRows=@($stageReport.completed | Where-Object { $_.id -eq 'evs-unused-camera-registrations' })
          if ($evsRows.Count -ne 1 -or [int]$evsRows[0].order -ne 38 -or
              [int]$evsRows[0].rewrittenExpressions -ne 4 -or
              [int]$evsRows[0].composedFiles -ne 1) {
            throw 'PASS6_EVS_MISSING_OR_NOT_COMPOSED_WITH_PS_STAGE'
          }
          $psRef='.pass6-evs-ps-ref'
          $cameraRef='.pass6-evs-camera-ref'
          & dotnet $dll phase2-evs-ps --game $game --out $psRef
          if ($LASTEXITCODE -ne 0) { throw 'PASS6_INDEPENDENT_EVS_PS_FAILED' }
          & dotnet $dll phase2-evs-camera --game $game --base-overlay $psRef --out $cameraRef
          if ($LASTEXITCODE -ne 0) { throw 'PASS6_INDEPENDENT_EVS_CAMERA_FAILED' }
          $camReport=Get-Content -LiteralPath (Join-Path $cameraRef 'phase2-result.json') -Raw | ConvertFrom-Json
          if ($camReport.ruleId -ne 'EVS_UNUSED_CAMERA_INPUT_REGISTRATIONS_V1' -or
              $camReport.status -ne 'APPLIED' -or [int]$camReport.appliedEdits -ne 4) {
            throw ('PASS6_EVS_CAMERA_GENERATION_REFUSED: '+$camReport.status+' '+$camReport.reason)
          }
          $camSrc=Join-Path $cameraRef $camReport.sourcePath
          $camDest=Join-Path $staged $camReport.sourcePath
          if (!(Test-Path -LiteralPath $camSrc -PathType Leaf) -or
              !(Test-Path -LiteralPath $camDest -PathType Leaf) -or
              (Get-FileHash -LiteralPath $camSrc -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $camDest -Algorithm SHA256).Hash) {
            throw 'PASS6_EVS_CAMERA_NOT_ONE_PASS_BYTE_PARITY'
          }
          $camContent=Get-Content -LiteralPath $camDest -Raw
          foreach($required in @(
            'gcoOnActionPS',
            'wrappedMethod();',
            'player.RegisterInputListener(this, n"CycleDoor")',
            'player.RegisterInputListener(this, n"CycleWindow")')) {
            if (!$camContent.Contains($required,[StringComparison]::Ordinal)) {
              throw ('PASS6_EVS_CAMERA_DROPPED_PREVIOUS_OPERATION: '+$required)
            }
          }
          Write-Host 'PASS production one-pass EVS camera #38: prior #30 and all native/other input preserved'

          & ./tests/GRedscript.Resolver.Tests/Verify-Phase2Checkpoint.ps1 -PostGenericRoot $game -CompilerRoot '.pass6-private/Compiler' -ResolverDll $dll -SemanticOverlayRoot $staged
          if (!$?) { throw 'PASS6_COMBINED_EFFECTIVE_SCC_FAILED' }

      - name: Remove private sources, compiler and generated overlays
        if: always()
        shell: pwsh
        run: |
          foreach ($path in @(
            '.pass6-private', '.pass6-plan.json', '.pass6-analysis.json',
            '.pass6-existing-stage', '.pass6-vad',
            '.pass6-evs-ps-ref', '.pass6-evs-camera-ref')) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }
