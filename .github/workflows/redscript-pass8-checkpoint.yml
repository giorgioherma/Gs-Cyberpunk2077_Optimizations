name: REDscript Pass 10 - approved Chipware memo SCC

on:
  workflow_dispatch:
  push:
    branches:
      - dev/redscript/pass10
    # Deliberate grouped checkpoints only: source/tests commits do not
    # auto-cancel each other. Dispatch manually or update the trigger file
    # after a meaningful source-proven batch has been assembled.
    paths:
      - 'tests/GRedscript.Pass8.Checkpoint/CI-TRIGGER.txt'

permissions:
  contents: read

concurrency:
  group: redscript-pass10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pass8:
    name: Pass 10 post-generic one-pass and official SCC
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated GCO branch
        uses: actions/checkout@v4
      - name: Checkout authoritative post-generic source and CI-only SCC
        uses: actions/checkout@v4
        with:
          repository: giorgioherma/original_cet_source
          ref: main
          token: ${{ secrets.GCET_STACK_SOURCES_TOKEN }}
          persist-credentials: false
          path: .phase2-private
          sparse-checkout: |
            base_after_generic/r6/scripts
            Compiler
          sparse-checkout-cone-mode: true
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated Pass 8 generator runner
        shell: pwsh
        run: |
          dotnet build tests/GRedscript.Pass8.Checkpoint/GRedscript.Pass8.Checkpoint.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'PASS8_DOTNET_BUILD_FAILED' }
      - name: Test stock, partial, complete, custom, absent, drift and repeat
        shell: pwsh
        run: |
          python -m unittest discover -s tests/GRedscript.Resolver.Tests -p 'test_pass8_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'PASS8_SOURCE_STATE_FAILED' }
          python -m unittest discover -s tests/GRedscript.Resolver.Tests -p 'test_phase2_pass10_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'PASS10_SOURCE_STATE_FAILED' }
      - name: Generate Pass 8 from actual post-generic mod sources once
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='tests/GRedscript.Pass8.Checkpoint/bin/Release/net10.0/GRedscript.Pass8.Checkpoint.dll'
          & dotnet $dll --game '.phase2-private/base_after_generic' --out '.phase2-pass8'
          if ($LASTEXITCODE -ne 0) { throw 'PASS8_GENERATION_FAILED' }
          $r=Get-Content -LiteralPath '.phase2-pass8/phase2-result.json' -Raw | ConvertFrom-Json
          if ($r.ruleId -ne 'CHIPWARE_PASS8_SOURCE_LOCAL_THROUGHPUT_V1' -or
              $r.status -ne 'APPLIED' -or $r.appliedEdits -lt 3 -or
              @($r.refusals).Count -ne 0) {
            throw ("PASS8_STOCK_SOURCE_NOT_COMPLETE: "+($r | ConvertTo-Json -Compress))
          }
          $scripts=@(Get-ChildItem -LiteralPath '.phase2-pass8/r6/scripts' -Recurse -File -Filter '*.reds')
          if ($scripts.Count -ne 3) { throw "PASS8_UNEXPECTED_FILE_COUNT:$($scripts.Count)" }
          Write-Host "PASS8 source operations: $($r.appliedEdits), changed files: $($scripts.Count)"
      - name: Generate and compose historical chipware combat cache
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='tests/GRedscript.Pass8.Checkpoint/bin/Release/net10.0/GRedscript.Pass8.Checkpoint.dll'
          & dotnet $dll --owner combat --game '.phase2-private/base_after_generic' --base-overlay '.phase2-pass8' --out '.phase2-chip-combat'
          if ($LASTEXITCODE -ne 0) { throw 'PASS8_CHIPWARE_COMBAT_GENERATION_FAILED' }
          $r=Get-Content -LiteralPath '.phase2-chip-combat/phase2-result.json' -Raw | ConvertFrom-Json
          if ($r.ruleId -ne 'CHIPWARE_PASS8_COMBAT_STATS_CACHE_V1' -or
              $r.status -ne 'APPLIED' -or $r.appliedEdits -ne 9 -or
              @($r.refusals).Count -ne 0) {
            throw ("PASS8_CHIPWARE_COMBAT_STOCK_NOT_COMPLETE: "+($r | ConvertTo-Json -Compress))
          }
          $root=(Resolve-Path '.phase2-chip-combat').Path
          $files=@(Get-ChildItem -LiteralPath '.phase2-chip-combat/r6/scripts' -Recurse -File -Filter '*.reds')
          if ($files.Count -ne 4) { throw "PASS8_COMBAT_FILE_COUNT_UNEXPECTED:$($files.Count)" }
          foreach($file in $files) {
            $rel=[IO.Path]::GetRelativePath($root,$file.FullName)
            if ([IO.Path]::IsPathRooted($rel) -or $rel.StartsWith('..')) {
              throw "PASS8_COMBAT_ESCAPE:$rel"
            }
            $dest=Join-Path '.phase2-pass8' $rel
            if (Test-Path -LiteralPath $dest -PathType Leaf) {
              # Both operations target the same owner but distinct method
              # bodies. Combat consumed the existing early-guard overlay.
              $content=Get-Content -LiteralPath $file.FullName -Raw
              if ($rel.EndsWith('wreckingBall.reds') -and !$content.Contains('if !isMelee')) {
                throw 'PASS8_COMBAT_LOST_EARLY_MELEE_GATE'
              }
              if ($rel.EndsWith('flashAndThunderclap.reds') -and !$content.Contains('if !gorillaArms')) {
                throw 'PASS8_COMBAT_LOST_EARLY_GORILLA_GATE'
              }
            }
            New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $dest -Force
          }
          Write-Host "PASS8 combat operations: $($r.appliedEdits); fully composed original files: $($files.Count)"

      - name: Generate and join ImmersiveCyberware Pass 8 operations
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='tests/GRedscript.Pass8.Checkpoint/bin/Release/net10.0/GRedscript.Pass8.Checkpoint.dll'
          & dotnet $dll --owner immersive --game '.phase2-private/base_after_generic' --base-overlay '.phase2-pass8' --out '.phase2-immersive'
          if ($LASTEXITCODE -ne 0) { throw 'PASS8_IMMERSIVE_GENERATION_FAILED' }
          $r=Get-Content -LiteralPath '.phase2-immersive/phase2-result.json' -Raw | ConvertFrom-Json
          if ($r.ruleId -ne 'IMMERSIVE_CYBERWARE_PASS8_HOTPATH_V1' -or
              $r.status -ne 'APPLIED' -or $r.appliedEdits -ne 3 -or
              @($r.refusals).Count -ne 0) {
            throw ("PASS8_IMMERSIVE_STOCK_SOURCE_NOT_COMPLETE: "+($r | ConvertTo-Json -Compress))
          }
          $files=@(Get-ChildItem -LiteralPath '.phase2-immersive/r6/scripts' -Recurse -File -Filter '*.reds')
          if ($files.Count -ne 3) {
            throw "PASS8_IMMERSIVE_FILE_COUNT_UNEXPECTED:$($files.Count)"
          }
          foreach($file in $files) {
            $rel=[IO.Path]::GetRelativePath((Resolve-Path '.phase2-immersive').Path,$file.FullName)
            if ([IO.Path]::IsPathRooted($rel) -or $rel.StartsWith('..')) {
              throw "PASS8_IMMERSIVE_PATH_ESCAPE:$rel"
            }
            $dest=Join-Path '.phase2-pass8' $rel
            if (Test-Path -LiteralPath $dest) {
              throw "PASS8_IMMERSIVE_CHIPWARE_OWNER_COLLISION:$rel"
            }
            New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $dest
          }
          Write-Host "PASS8 ImmersiveCyberware operations: $($r.appliedEdits), merged scripts: $($files.Count)"

      - name: Generate approved Chipware 100ms perk memo after Pass 8
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='tests/GRedscript.Pass8.Checkpoint/bin/Release/net10.0/GRedscript.Pass8.Checkpoint.dll'
          & dotnet $dll --owner memo --game '.phase2-private/base_after_generic' --base-overlay '.phase2-pass8' --out '.phase2-pass10'
          if ($LASTEXITCODE -ne 0) { throw 'PASS10_MEMO_GENERATION_FAILED' }
          $r=Get-Content -LiteralPath '.phase2-pass10/phase2-result.json' -Raw | ConvertFrom-Json
          if ($r.ruleId -ne 'CHIPWARE_100MS_PERK_RESULT_MEMO_V1' -or
              $r.status -ne 'APPLIED' -or $r.appliedEdits -lt 3 -or
              @($r.refusals).Count -ne 0) {
            throw ('PASS10_APPROVED_HISTORICAL_CACHE_NOT_GENERATED:' + ($r | ConvertTo-Json -Compress))
          }
          $root=(Resolve-Path '.phase2-pass10').Path
          $files=@(Get-ChildItem -LiteralPath '.phase2-pass10/r6/scripts' -Recurse -File -Filter '*.reds')
          if ($files.Count -ne 2) { throw ('PASS10_OWNER_AND_HELPER_NOT_COMPOSED:' + $files.Count) }
          foreach($file in $files) {
            $rel=[IO.Path]::GetRelativePath($root,$file.FullName)
            if ([IO.Path]::IsPathRooted($rel) -or $rel.StartsWith('..') -or
                !$rel.Replace('\','/').StartsWith('r6/scripts/zzy_bChipwareExpansion/')) {
              throw ('PASS10_OWNER_PATH_ESCAPE:' + $rel)
            }
            $dest=Join-Path '.phase2-pass8' $rel
            if (!(Test-Path -LiteralPath $dest -PathType Leaf)) {
              throw ('PASS10_UNEXPECTED_OWNER_OR_HELPER:' + $rel)
            }
            Copy-Item -LiteralPath $file.FullName -Destination $dest -Force
          }
          Write-Host 'PASS Chipware approved 100ms memo composed into Pass 8 owner/helper'
          & dotnet $dll --owner memo --game '.phase2-private/base_after_generic' --base-overlay '.phase2-pass8' --out '.phase2-pass10-repeat'
          if ($LASTEXITCODE -ne 0) { throw 'PASS10_REPEAT_GENERATION_FAILED' }
          $repeat=Get-Content -LiteralPath '.phase2-pass10-repeat/phase2-result.json' -Raw | ConvertFrom-Json
          $again=@(Get-ChildItem -LiteralPath '.phase2-pass10-repeat' -Recurse -File -Filter '*.reds')
          if ($repeat.appliedEdits -ne 0 -or $again.Count -ne 0 -or
              $repeat.status -ne 'COMPLETE') { throw 'PASS10_REPEAT_NOT_IDEMPOTENT' }
          Write-Host 'PASS Chipware repeat COMPLETE, zero additional output'

      - name: Compile authoritative source plus actual Pass 8 overlay using official SCC 0.5.31
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./tests/GRedscript.Resolver.Tests/Verify-Phase2Checkpoint.ps1 -PostGenericRoot '.phase2-private/base_after_generic' -CompilerRoot '.phase2-private/Compiler' -ResolverDll 'src/GRedscript.Resolver/bin/Release/net10.0/GRedscript.Resolver.dll' -SemanticOverlayRoot '.phase2-pass8'
          if (!$?) { throw 'PASS8_EFFECTIVE_SOURCE_SCC_FAILED' }
      - name: Verify production one-pass Pass 8 composition, byte parity and SCC
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./tests/GRedscript.Pass8.Checkpoint/Verify-CanonicalPass8.ps1 -PostGenericRoot '.phase2-private/base_after_generic' -IsolatedOverlayRoot '.phase2-pass8'
          if (!$?) { throw 'PASS8_CANONICAL_ONE_PASS_OR_SCC_FAILED' }
      - name: Clean private source and compiler
        if: always()
        shell: pwsh
        run: |
          foreach($p in @('.phase2-private','.phase2-pass8','.phase2-chip-combat','.phase2-immersive','.phase2-pass10','.phase2-pass10-repeat')) {
            if (Test-Path -LiteralPath $p) {
              Remove-Item -LiteralPath $p -Recurse -Force
            }
          }
